<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #1d1c1a; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 80px 80px 100px;
}
.orb1 {
  position: absolute; top: -100px; right: -80px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, #d9a93f 0%, transparent 70%);
  filter: blur(120px); opacity: 0.25;
}
.orb2 {
  position: absolute; bottom: -60px; left: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, #ffde43 0%, transparent 70%);
  filter: blur(100px); opacity: 0.15;
}
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  height: 100%;
}
.icon {
  font-size: 80px;
  margin-bottom: 40px;
  filter: grayscale(0.2);
}
.number {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 280px;
  color: #ffde43;
  line-height: 0.85;
  letter-spacing: -0.03em;
}
.unit {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 90px;
  color: #efedeb;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  margin-top: 10px;
}
.subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 32px;
  color: rgba(239, 237, 235, 0.7);
  margin-top: 40px;
  line-height: 1.4;
  max-width: 700px;
}
.swipe {
  position: absolute;
  bottom: 140px; right: 80px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 22px;
  color: rgba(239, 237, 235, 0.5);
  letter-spacing: 0.05em;
}
.logo {
  position: absolute;
  bottom: 60px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 40px;
  color: #ffde43;
}
</style>
</head>
<body>
<div class="orb1"></div>
<div class="orb2"></div>
<div class="content">
  <div class="icon">⏱️</div>
  <div class="number">5</div>
  <div class="unit">MINUTOS</div>
  <div class="subtitle">É tudo que você tem pra não perder esse lead.</div>
</div>
<div class="swipe">desliza →</div>
<div class="logo">Kaivaa</div>
</body>
</html>
