<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #1d1c1a; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
  padding: 80px 80px 120px;
}
.pill {
  display: inline-block;
  background: #ffde43; color: #1d1c1a;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 72px;
  padding: 12px 44px; border-radius: 100px;
  margin-bottom: 20px;
}
.headline {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 48px;
  color: #efedeb; text-align: center;
  line-height: 1.15; margin-bottom: 50px;
}
.checklist {
  width: 100%; max-width: 780px;
}
.check-item {
  display: flex; align-items: center; gap: 20px;
  padding: 22px 30px;
  border-radius: 16px;
  margin-bottom: 12px;
  background: rgba(255,222,67,0.06);
  border: 1px solid rgba(255,222,67,0.1);
}
.check-icon {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,222,67,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.check-text {
  font-family: 'Inter', sans-serif;
  font-weight: 500; font-size: 26px;
  color: #efedeb;
}
.body-text {
  font-family: 'Inter', sans-serif;
  font-weight: 400; font-size: 28px;
  color: rgba(239,237,235,0.7);
  text-align: center; line-height: 1.5;
  max-width: 780px; margin-top: 40px;
}
.body-text strong { color: #efedeb; font-weight: 600; }
.logo {
  position: absolute; bottom: 50px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 36px; color: #ffde43;
}
</style>
</head>
<body>
<div class="pill">80%</div>
<div class="headline">das conversas resolvidas<br>sem você tocar no celular.</div>
<div class="checklist">
  <div class="check-item">
    <div class="check-icon">💰</div>
    <div class="check-text">Preço e condições de pagamento</div>
  </div>
  <div class="check-item">
    <div class="check-icon">🕐</div>
    <div class="check-text">Horário de funcionamento</div>
  </div>
  <div class="check-item">
    <div class="check-icon">🚚</div>
    <div class="check-text">Entrega e disponibilidade</div>
  </div>
  <div class="check-item">
    <div class="check-icon">📋</div>
    <div class="check-text">Cardápio, catálogo e opções</div>
  </div>
</div>
<div class="body-text">Os outros 20%? A IA transfere pra você com o <strong>contexto completo</strong>. Nenhuma mensagem perdida.</div>
<div class="logo">Kaivaa</div>
</body>
</html>
