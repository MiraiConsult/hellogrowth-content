<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #1d1c1a; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
  padding: 80px 70px 120px;
}
.title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 48px;
  color: #efedeb; text-align: center;
  margin-bottom: 50px; line-height: 1.15;
}
.title .slow { color: #6b6862; }
.title .fast { color: #ffde43; }
.comparison {
  display: flex; gap: 24px;
  width: 100%; max-width: 920px;
}
.box {
  flex: 1; border-radius: 24px;
  padding: 40px 30px;
  display: flex; flex-direction: column;
  align-items: center; gap: 20px;
}
.box.before {
  background: rgba(107, 104, 98, 0.15);
  border: 1px solid rgba(107, 104, 98, 0.25);
}
.box.after {
  background: rgba(255, 222, 67, 0.1);
  border: 1px solid rgba(255, 222, 67, 0.25);
}
.box-label {
  font-family: 'Inter', sans-serif;
  font-weight: 600; font-size: 22px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 6px 20px;
  border-radius: 50px;
}
.before .box-label { color: #6b6862; background: rgba(107, 104, 98, 0.2); }
.after .box-label { color: #ffde43; background: rgba(255, 222, 67, 0.15); }
.metric {
  text-align: center;
  padding: 12px 0;
}
.metric-value {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 52px;
}
.before .metric-value { color: #6b6862; }
.after .metric-value { color: #ffde43; }
.metric-label {
  font-family: 'Inter', sans-serif;
  font-weight: 500; font-size: 20px;
  color: rgba(239, 237, 235, 0.6);
  margin-top: 4px;
}
.divider {
  width: 80%; height: 1px;
  background: rgba(239, 237, 235, 0.1);
}
.footer-text {
  font-family: 'Inter', sans-serif;
  font-weight: 500; font-size: 26px;
  color: rgba(239, 237, 235, 0.6);
  text-align: center;
  margin-top: 40px; line-height: 1.4;
}
.footer-text strong { color: #efedeb; font-weight: 600; }
.logo {
  position: absolute; bottom: 50px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 36px; color: #ffde43;
}
</style>
</head>
<body>
<div class="title"><span class="slow">30 minutos</span> vs <span class="fast">30 segundos</span></div>
<div class="comparison">
  <div class="box before">
    <div class="box-label">Antes</div>
    <div class="metric">
      <div class="metric-value">30 min</div>
      <div class="metric-label">Tempo de resposta</div>
    </div>
    <div class="divider"></div>
    <div class="metric">
      <div class="metric-value">2-5%</div>
      <div class="metric-label">Qualificação</div>
    </div>
    <div class="divider"></div>
    <div class="metric">
      <div class="metric-value">1-3%</div>
      <div class="metric-label">Conversão</div>
    </div>
  </div>
  <div class="box after">
    <div class="box-label">Depois</div>
    <div class="metric">
      <div class="metric-value">30 seg</div>
      <div class="metric-label">Tempo de resposta</div>
    </div>
    <div class="divider"></div>
    <div class="metric">
      <div class="metric-value">20-40%</div>
      <div class="metric-label">Qualificação</div>
    </div>
    <div class="divider"></div>
    <div class="metric">
      <div class="metric-value">5-15%</div>
      <div class="metric-label">Conversão</div>
    </div>
  </div>
</div>
<div class="footer-text"><strong>Mesmos leads. Mesmo produto.</strong><br>Só mudou a velocidade.</div>
<div class="logo">Kaivaa</div>
</body>
</html>
