<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #292824; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
  padding: 80px 80px 120px;
}
.headline {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 54px;
  color: #efedeb; text-align: center;
  line-height: 1.15; margin-bottom: 50px;
}
.headline em { font-style: normal; color: #ffde43; }
.graph {
  width: 820px; height: 340px;
  position: relative;
  margin-bottom: 40px;
}
.graph-bg {
  position: absolute; inset: 0;
  border-left: 2px solid rgba(239,237,235,0.15);
  border-bottom: 2px solid rgba(239,237,235,0.15);
}
.graph-line {
  position: absolute; top: 20px; left: 0; right: 0; bottom: 0;
}
.graph-line svg { width: 100%; height: 100%; }
.graph-labels {
  display: flex; justify-content: space-between;
  margin-top: 12px; width: 820px;
}
.graph-label {
  font-family: 'Inter', sans-serif;
  font-weight: 500; font-size: 20px;
  color: rgba(239,237,235,0.5);
}
.graph-label.highlight { color: #ffde43; font-weight: 700; }
.body-text {
  font-family: 'Inter', sans-serif;
  font-weight: 400; font-size: 28px;
  color: rgba(239, 237, 235, 0.75);
  text-align: center; line-height: 1.5;
  max-width: 800px; margin-top: 20px;
}
.logo {
  position: absolute; bottom: 50px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 36px; color: #ffde43;
}
</style>
</head>
<body>
<div class="headline">O lead esfria a cada segundo<br>sem <em>resposta</em>.</div>
<div class="graph">
  <div class="graph-bg"></div>
  <div class="graph-line">
    <svg viewBox="0 0 820 300" fill="none">
      <defs>
        <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffde43" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#ffde43" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0,30 C100,35 150,80 250,150 C350,220 450,260 600,275 L820,280 L820,300 L0,300 Z" fill="url(#glow)"/>
      <path d="M0,30 C100,35 150,80 250,150 C350,220 450,260 600,275 L820,280" stroke="#ffde43" stroke-width="4" fill="none"/>
      <circle cx="0" cy="30" r="8" fill="#ffde43"/>
      <circle cx="250" cy="150" r="6" fill="#ffde43" opacity="0.7"/>
      <circle cx="600" cy="275" r="6" fill="#6b6862" opacity="0.5"/>
    </svg>
  </div>
</div>
<div class="graph-labels">
  <span class="graph-label highlight">1 min</span>
  <span class="graph-label highlight">5 min</span>
  <span class="graph-label">15 min</span>
  <span class="graph-label">30 min</span>
</div>
<div class="body-text">A janela de oportunidade é mais curta do que você imagina. Em 5 minutos, seu lead já está olhando o concorrente.</div>
<div class="logo">Kaivaa</div>
</body>
</html>
