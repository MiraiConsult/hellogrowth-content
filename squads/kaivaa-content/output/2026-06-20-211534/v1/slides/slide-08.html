<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #1d1c1a; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
  padding: 80px 80px 120px;
}
.orb1 {
  position: absolute; top: -150px; left: 50%;
  transform: translateX(-50%);
  width: 700px; height: 700px;
  background: radial-gradient(circle, #ffde43 0%, transparent 60%);
  filter: blur(180px); opacity: 0.12;
}
.orb2 {
  position: absolute; bottom: -100px; right: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, #d9a93f 0%, transparent 70%);
  filter: blur(120px); opacity: 0.15;
}
.content {
  position: relative; z-index: 1;
  text-align: center;
  display: flex; flex-direction: column;
  align-items: center;
}
.headline {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 60px;
  color: #ffde43; text-transform: uppercase;
  line-height: 1.05; letter-spacing: -0.02em;
  margin-bottom: 24px;
}
.subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 500; font-size: 32px;
  color: #efedeb;
  margin-bottom: 60px;
}
.cta-box {
  background: #ffde43;
  color: #1d1c1a;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 28px;
  padding: 22px 50px;
  border-radius: 100px;
  margin-bottom: 50px;
}
.save {
  font-family: 'Inter', sans-serif;
  font-weight: 500; font-size: 24px;
  color: rgba(239,237,235,0.6);
  margin-bottom: 8px;
}
.source {
  font-family: 'Inter', sans-serif;
  font-weight: 400; font-size: 18px;
  color: rgba(239,237,235,0.35);
  margin-top: 30px;
}
.logo {
  position: absolute; bottom: 50px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 52px; color: #ffde43;
}
</style>
</head>
<body>
<div class="orb1"></div>
<div class="orb2"></div>
<div class="content">
  <div class="headline">Seus leads<br>não vão esperar.</div>
  <div class="subtitle">Comece grátis com a Kaivaa hoje.</div>
  <div class="cta-box">LINK NA BIO →</div>
  <div class="save">💾 Salva e manda pra quem precisa ver esses dados.</div>
  <div class="source">Dados: SocialHub (Mar/2026) · 180 negócios brasileiros</div>
</div>
<div class="logo">Kaivaa</div>
</body>
</html>
