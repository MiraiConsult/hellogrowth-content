<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #292824; overflow: hidden; }
body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 80px 70px 120px; }
.label { font-family: 'Inter'; font-weight: 600; font-size: 20px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(239,237,235,0.4); margin-bottom: 20px; }
.headline { font-family: 'Space Grotesk'; font-weight: 700; font-size: 48px; color: #efedeb; text-align: center; line-height: 1.15; margin-bottom: 50px; }
.headline em { font-style: normal; color: #00c46a; }
.stats { display: flex; gap: 30px; width: 100%; max-width: 900px; margin-bottom: 40px; }
.stat { flex: 1; background: rgba(0,196,106,0.06); border: 1px solid rgba(0,196,106,0.15); border-radius: 20px; padding: 30px 20px; text-align: center; }
.stat-value { font-family: 'Orbitron'; font-weight: 800; font-size: 52px; color: #83e509; margin-bottom: 8px; }
.stat-label { font-family: 'Inter'; font-weight: 500; font-size: 18px; color: rgba(239,237,235,0.6); line-height: 1.3; }
.body-text { font-family: 'Inter'; font-weight: 400; font-size: 26px; color: rgba(239,237,235,0.7); text-align: center; line-height: 1.5; max-width: 800px; }
.body-text strong { color: #efedeb; font-weight: 600; }
.logo { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-family: 'Space Grotesk'; font-weight: 700; font-size: 36px; }
.logo .mir { color: #efedeb; } .logo .ai { color: #00c46a; }
</style>
</head>
<body>
<div class="label">Enquanto isso, quem executa...</div>
<div class="headline">Os números de quem <em>já saiu do plano</em></div>
<div class="stats">
  <div class="stat">
    <div class="stat-value">41,9%</div>
    <div class="stat-label">das empresas BR<br>já usam IA</div>
  </div>
  <div class="stat">
    <div class="stat-value">2,5x</div>
    <div class="stat-label">crescimento<br>em 2 anos</div>
  </div>
  <div class="stat">
    <div class="stat-value">9%</div>
    <div class="stat-label">operam 100+<br>agentes de IA</div>
  </div>
</div>
<div class="body-text">O Brasil <strong>lidera a adoção de agentes de IA</strong> no mundo — superando EUA (2%) e UK (3,4%). Taxa de fracasso: <strong>apenas 3,6%</strong>.</div>
<div class="logo"><span class="mir">Mir</span><span class="ai">AI</span></div>
</body>
</html>
