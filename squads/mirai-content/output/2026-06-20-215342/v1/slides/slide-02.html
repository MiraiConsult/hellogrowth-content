<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #292824; overflow: hidden; }
body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; justify-content: center; position: relative; padding: 80px 80px 120px; }
.bar { position: absolute; left: 0; top: 100px; bottom: 100px; width: 6px; background: linear-gradient(180deg, #00c46a, #83e509); }
.headline { font-family: 'Space Grotesk'; font-weight: 700; font-size: 50px; color: #efedeb; line-height: 1.15; margin-bottom: 40px; max-width: 850px; }
.headline em { font-style: normal; color: #83e509; }
.body-text { font-family: 'Inter'; font-weight: 400; font-size: 28px; color: rgba(239,237,235,0.75); line-height: 1.55; max-width: 850px; }
.body-text strong { color: #efedeb; font-weight: 600; }
.pill { display: inline-block; background: #83e509; color: #1d1c1a; font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; padding: 8px 24px; border-radius: 100px; margin-bottom: 24px; }
.logo { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-family: 'Space Grotesk'; font-weight: 700; font-size: 36px; }
.logo .mir { color: #efedeb; } .logo .ai { color: #00c46a; }
</style>
</head>
<body>
<div class="bar"></div>
<div>
  <div class="pill">ABES · 103 EXECUTIVOS</div>
  <div class="headline">7 em cada 10 empresas estão construindo caminho para <em>IA agêntica</em>.</div>
  <div class="body-text">Mas existe uma lacuna crítica: embora <strong>53% saibam o que querem</strong> alcançar com IA, as capacidades de execução real ficam <strong>abaixo de 40%</strong>.<br><br>A diferença entre intenção e resultado? <strong>Ter quem execute.</strong></div>
</div>
<div class="logo"><span class="mir">Mir</span><span class="ai">AI</span></div>
</body>
</html>
