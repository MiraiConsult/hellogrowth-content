<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #e0eadb;
  font-family: 'Inter', sans-serif;
  color: #004d40;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse 900px 700px at top left, rgba(191,255,0,0.25) 0%, transparent 60%),
    radial-gradient(ellipse 700px 800px at bottom right, rgba(40,174,97,0.15) 0%, transparent 65%),
    linear-gradient(180deg, #f2f7ee 0%, #e8ede5 50%, #e0eadb 100%);
  padding: 100px 80px;
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(0,77,64,0.4);
  letter-spacing: 0.05em;
}
.fifa-tag {
  display: inline-flex; align-items: center;
  background: rgba(255,255,255,0.7);
  border: 2px solid rgba(0,77,64,0.15);
  border-radius: 100px;
  padding: 14px 32px;
  margin-top: 60px; margin-bottom: 30px;
  backdrop-filter: blur(6px);
}
.fifa-tag span {
  font-size: 22px; font-weight: 700; color: #004d40;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.lona-visual {
  width: 100%; display: flex; flex-direction: column; align-items: center;
  margin-bottom: 30px;
}
.stadium-line { width: 650px; height: 6px; background: rgba(0,77,64,0.12); border-radius: 3px; }
.lona-block {
  width: 420px; height: 160px;
  background: rgba(255,255,255,0.85);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  margin: 16px 0;
  box-shadow: 0 8px 30px rgba(0,77,64,0.08);
  border: 1px solid rgba(0,77,64,0.06);
}
.lona-ghost {
  font-size: 36px; font-weight: 800; color: rgba(0,77,64,0.06);
  letter-spacing: 0.1em; text-transform: uppercase;
}
.body-text {
  font-size: 42px; font-weight: 700;
  color: #1b6b5b; line-height: 1.25;
  margin-bottom: 14px;
}
.headline-mega {
  font-size: 80px; font-weight: 900;
  color: #004d40; line-height: 1.0;
  text-transform: uppercase;
  letter-spacing: -0.04em;
  margin-bottom: 14px;
}
.headline-mega .accent { color: #c41230; }
.pilula {
  display: inline-block;
  background: #bfff00;
  font-size: 38px; font-weight: 900;
  color: #004d40; line-height: 1;
  padding: 14px 32px;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  border-radius: 100px;
  box-shadow: 0 12px 50px rgba(191,255,0,0.3);
  margin-top: 10px;
}
.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-full img { height: 110px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #28ae61;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 28px rgba(40,174,97,0.40);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="fifa-tag"><span>Copa do Mundo 2026</span></div>

  <div class="lona-visual">
    <div class="stadium-line"></div>
    <div class="lona-block"><div class="lona-ghost">LEVI'S</div></div>
    <div class="stadium-line"></div>
  </div>

  <div class="body-text">A FIFA tapou o logo de uma<br>marca que pagou</div>
  <div class="headline-mega"><span class="accent">R$ 1 BILHÃO</span></div>
  <div class="pilula">para ter o nome no estádio</div>

  <div class="bottom-row">
    <div class="logo-full"><img src="assets/logo-full.svg" alt="HelloGrowth"></div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#edf0ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
