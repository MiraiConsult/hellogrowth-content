<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0f0e0d;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.orb1{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(circle,#00c46a 0%,transparent 50%);filter:blur(200px);opacity:0.12}
.orb2{position:absolute;bottom:-150px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,#83e509 0%,transparent 70%);filter:blur(140px);opacity:0.08}
.kanji{font-size:80px;color:rgba(0,196,106,0.25);margin-bottom:30px;position:relative;z-index:1}
.headline{font-family:'Space Grotesk';font-weight:700;font-size:72px;color:#83e509;text-transform:uppercase;text-align:center;line-height:1.05;letter-spacing:-0.02em;position:relative;z-index:1;margin-bottom:30px}
.sub{font-family:'Inter';font-weight:500;font-size:34px;color:#efedeb;position:relative;z-index:1;margin-bottom:60px}
.cta{background:#00c46a;color:#0f0e0d;font-family:'Space Grotesk';font-weight:700;font-size:30px;padding:24px 56px;border-radius:100px;position:relative;z-index:1;margin-bottom:40px}
.save{font-family:'Inter';font-weight:500;font-size:24px;color:rgba(239,237,235,0.4);position:relative;z-index:1;margin-bottom:10px}
.src{font-family:'Inter';font-weight:400;font-size:18px;color:rgba(239,237,235,0.25);position:relative;z-index:1;text-align:center;max-width:700px}
.logo{position:absolute;bottom:80px;font-family:'Space Grotesk';font-weight:700;font-size:56px;z-index:1}
.logo .mir{color:#efedeb}.logo .ai{color:#00c46a}
</style></head><body>
<div class="orb1"></div><div class="orb2"></div>
<div class="kanji">未来</div>
<div class="headline">O futuro<br>pertence a<br>quem executa.</div>
<div class="sub">Saia da intenção. Chegue no resultado.</div>
<div class="cta">AGENDE UMA CONVERSA →</div>
<div class="save">💾 Salva e manda pra quem precisa ouvir isso.</div>
<div class="src">Fontes: ABES (Jun/2026) · IBGE · Jitterbit · GoMind</div>
<div class="logo"><span class="mir">Mir</span><span class="ai">AI</span></div>
</body></html>
