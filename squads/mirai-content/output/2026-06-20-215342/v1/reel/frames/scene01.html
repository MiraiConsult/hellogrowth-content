<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0f0e0d;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.orb{position:absolute;top:-200px;right:-100px;width:600px;height:600px;background:radial-gradient(circle,#00c46a 0%,transparent 70%);filter:blur(180px);opacity:0.15}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,196,106,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,196,106,0.02) 1px,transparent 1px);background-size:40px 40px}
.tag{font-family:'Inter';font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:0.2em;color:#00c46a;margin-bottom:60px;position:relative;z-index:1}
.num{font-family:'Space Grotesk';font-weight:700;font-size:280px;color:#83e509;line-height:0.85;position:relative;z-index:1}
.logo{position:absolute;bottom:80px;font-family:'Space Grotesk';font-weight:700;font-size:44px;z-index:1}
.logo .mir{color:#efedeb}.logo .ai{color:#00c46a}
</style></head><body>
<div class="orb"></div><div class="grid"></div>
<div class="tag">Pesquisa ABES · Jun 2026</div>
<div class="num">53%</div>
<div class="logo"><span class="mir">Mir</span><span class="ai">AI</span></div>
</body></html>
