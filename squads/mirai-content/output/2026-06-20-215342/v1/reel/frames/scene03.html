<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#141312;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:80px 60px}
.bar{position:absolute;left:0;top:200px;bottom:200px;width:5px;background:linear-gradient(180deg,#00c46a,#83e509)}
.headline{font-family:'Space Grotesk';font-weight:700;font-size:52px;color:#efedeb;text-align:center;line-height:1.15;margin-bottom:60px;position:relative;z-index:1}
.headline em{font-style:normal;color:#83e509}
.block{width:100%;max-width:900px;display:flex;align-items:center;gap:24px;padding:32px 28px;border-radius:20px;border:1px solid rgba(0,196,106,0.12);background:rgba(0,196,106,0.04);margin-bottom:20px;position:relative;z-index:1}
.block-icon{width:60px;height:60px;border-radius:16px;background:rgba(131,229,9,0.1);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.block-title{font-family:'Space Grotesk';font-weight:700;font-size:28px;color:#83e509;margin-bottom:6px}
.block-desc{font-family:'Inter';font-weight:400;font-size:22px;color:rgba(239,237,235,0.6);line-height:1.35}
.logo{position:absolute;bottom:80px;font-family:'Space Grotesk';font-weight:700;font-size:44px;z-index:1}
.logo .mir{color:#efedeb}.logo .ai{color:#00c46a}
</style></head><body>
<div class="bar"></div>
<div class="headline">Os <em>3 gargalos</em> que travam<br>a execução</div>
<div class="block"><div class="block-icon">📊</div><div><div class="block-title">1. ROI difícil de provar</div><div class="block-desc">Sem métricas claras, investimento trava.</div></div></div>
<div class="block"><div class="block-icon">🗄️</div><div><div class="block-title">2. Dados desorganizados</div><div class="block-desc">IA sem dados = GPS sem mapa.</div></div></div>
<div class="block"><div class="block-icon">🧠</div><div><div class="block-title">3. Falta de expertise</div><div class="block-desc">Time de IA é caro. PMEs não têm por onde começar.</div></div></div>
<div class="logo"><span class="mir">Mir</span><span class="ai">AI</span></div>
</body></html>
