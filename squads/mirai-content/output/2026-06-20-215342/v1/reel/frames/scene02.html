<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0f0e0d;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.orb{position:absolute;bottom:-200px;left:-100px;width:500px;height:500px;background:radial-gradient(circle,#83e509 0%,transparent 70%);filter:blur(160px);opacity:0.12}
.top{font-family:'Space Grotesk';font-weight:700;font-size:180px;color:#83e509;line-height:0.85;position:relative;z-index:1;margin-bottom:20px}
.vs{font-family:'Space Grotesk';font-weight:700;font-size:60px;color:rgba(239,237,235,0.2);position:relative;z-index:1;margin:15px 0}
.bot{font-family:'Space Grotesk';font-weight:700;font-size:160px;color:#4a5548;line-height:0.85;position:relative;z-index:1;margin-bottom:40px}
.sub{font-family:'Inter';font-weight:500;font-size:36px;color:rgba(239,237,235,0.55);text-align:center;line-height:1.35;position:relative;z-index:1;max-width:800px}
.sub em{font-style:normal;color:#efedeb}
.logo{position:absolute;bottom:80px;font-family:'Space Grotesk';font-weight:700;font-size:44px;z-index:1}
.logo .mir{color:#efedeb}.logo .ai{color:#00c46a}
</style></head><body>
<div class="orb"></div>
<div class="top">53%</div>
<div class="vs">vs</div>
<div class="bot">&lt;40%</div>
<div class="sub"><em>Priorizam IA.</em><br>Mas não conseguem executar.</div>
<div class="logo"><span class="mir">Mir</span><span class="ai">AI</span></div>
</body></html>
