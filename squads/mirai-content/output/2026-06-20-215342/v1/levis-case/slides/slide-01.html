<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#0a0a0a;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:80px 70px 100px}
.lona{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:520px;height:340px;background:#e8e4df;border-radius:6px;box-shadow:0 20px 80px rgba(0,0,0,0.5);opacity:0.12}
.tag{font-family:'Inter';font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:0.2em;color:#c41230;margin-bottom:40px;position:relative;z-index:1}
.headline{font-family:'Space Grotesk';font-weight:700;font-size:48px;color:#ffffff;text-align:center;line-height:1.2;position:relative;z-index:1;max-width:900px}
.headline em{font-style:normal;color:#c41230}
.headline strong{color:#ffffff;font-weight:700}
.sub{font-family:'Inter';font-weight:400;font-size:24px;color:rgba(255,255,255,0.4);text-align:center;margin-top:40px;position:relative;z-index:1}
.stadium-visual{position:relative;z-index:1;margin-bottom:50px;display:flex;flex-direction:column;align-items:center}
.stadium-bar{width:600px;height:8px;background:linear-gradient(90deg,#1a1a1a,#333,#1a1a1a);border-radius:4px;margin-bottom:20px}
.covered-logo{width:400px;height:180px;background:#e8e4df;border-radius:4px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
.covered-text{font-family:'Space Grotesk';font-weight:700;font-size:32px;color:rgba(0,0,0,0.08);letter-spacing:0.1em}
.swipe{position:absolute;bottom:120px;right:70px;font-family:'Inter';font-weight:500;font-size:20px;color:rgba(255,255,255,0.3)}
.logo{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-family:'Space Grotesk';font-weight:700;font-size:32px;color:rgba(255,255,255,0.15)}
</style></head><body>
<div class="tag">Copa do Mundo 2026</div>
<div class="stadium-visual">
  <div class="stadium-bar"></div>
  <div class="covered-logo"><div class="covered-text">LEVI'S</div></div>
  <div class="stadium-bar" style="margin-top:20px;margin-bottom:0"></div>
</div>
<div class="headline">"A FIFA <em>tapou o logo</em> de uma marca que pagou <strong>R$ 1 bilhão</strong> para ter o nome no estádio."</div>
<div class="sub">E o que aconteceu depois mudou o jogo.</div>
<div class="swipe">desliza →</div>
<div class="logo">HelloGrowth</div>
</body></html>
