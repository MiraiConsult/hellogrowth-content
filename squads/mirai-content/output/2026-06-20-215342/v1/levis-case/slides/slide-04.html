<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#0d0d0d;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:80px 70px 100px}
.tag{font-family:'Inter';font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:0.2em;color:#c41230;margin-bottom:40px;position:relative;z-index:1}
.headline{font-family:'Space Grotesk';font-weight:700;font-size:46px;color:#ffffff;text-align:center;line-height:1.15;margin-bottom:50px;position:relative;z-index:1;max-width:860px}
.headline em{font-style:normal;color:#c41230}
.profile-mock{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;margin-bottom:40px}
.profile-row{display:flex;align-items:center;gap:30px}
.avatar{width:160px;height:160px;border-radius:50%;background:#c41230;display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar-lona{width:100px;height:50px;background:#e8e4df;border-radius:3px;transform:rotate(-2deg)}
.profile-info{display:flex;flex-direction:column;gap:6px}
.profile-name{font-family:'Inter';font-weight:700;font-size:26px;color:#ffffff}
.profile-stats{display:flex;gap:30px}
.stat-item{text-align:center}
.stat-num{font-family:'Space Grotesk';font-weight:700;font-size:22px;color:#ffffff}
.stat-label{font-family:'Inter';font-weight:400;font-size:15px;color:rgba(255,255,255,0.5)}
.profile-bio{font-family:'Inter';font-weight:400;font-size:18px;color:rgba(255,255,255,0.6);margin-top:12px}
.arrow-down{font-size:40px;color:#c41230;margin:20px 0}
.body-text{font-family:'Inter';font-weight:400;font-size:28px;color:rgba(255,255,255,0.7);text-align:center;line-height:1.55;max-width:800px;position:relative;z-index:1}
.body-text strong{color:#ffffff;font-weight:600}
.body-text em{font-style:normal;color:#c41230;font-weight:600}
.logo{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-family:'Space Grotesk';font-weight:700;font-size:32px;color:rgba(255,255,255,0.15)}
</style></head><body>
<div class="tag">O movimento</div>
<div class="headline">A Levi's <em>transformou a censura</em> em identidade visual</div>
<div class="profile-mock">
  <div class="profile-row">
    <div class="avatar"><div class="avatar-lona"></div></div>
    <div class="profile-info">
      <div class="profile-name">Levi's ✓</div>
      <div class="profile-stats">
        <div class="stat-item"><div class="stat-num">161</div><div class="stat-label">posts</div></div>
        <div class="stat-item"><div class="stat-num">10,4 mi</div><div class="stat-label">seguidores</div></div>
        <div class="stat-item"><div class="stat-num">34</div><div class="stat-label">seguindo</div></div>
      </div>
      <div class="profile-bio">Behind Every Original</div>
    </div>
  </div>
</div>
<div class="body-text">Trocou a foto de perfil em <strong>todas as redes sociais</strong> para imitar exatamente o <em>logo encoberto</em> no estádio.</div>
<div class="logo">HelloGrowth</div>
</body></html>
