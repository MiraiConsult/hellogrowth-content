<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #0a5e4d;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.20) 0%, transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(40,174,97,0.18) 0%, transparent 55%),
    linear-gradient(160deg, #0f6652 0%, #1b6b5b 40%, #0a5e4d 100%);
  padding: 100px 80px;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}
.kicker {
  font-size: 28px; font-weight: 500; color: rgba(237,240,238,0.6);
  text-transform: uppercase; letter-spacing: 0.15em;
  margin-top: 80px; margin-bottom: 20px;
}
.money {
  font-size: 180px; font-weight: 900;
  color: #edf0ee; line-height: 0.9;
  letter-spacing: -0.06em;
  margin-bottom: 10px;
}
.money .accent { color: #bfff00; }
.subtitle {
  font-size: 32px; font-weight: 500;
  color: rgba(237,240,238,0.5);
  margin-bottom: 50px;
}
.body-text {
  font-size: 34px; font-weight: 500;
  color: rgba(237,240,238,0.8);
  line-height: 1.5;
  margin-bottom: 30px;
}
.body-text strong { color: #edf0ee; font-weight: 800; }
.body-text .accent { color: #bfff00; font-weight: 800; }
.timeline {
  display: flex; align-items: center; gap: 14px;
  margin-top: 30px;
}
.t-label { font-size: 24px; font-weight: 700; color: rgba(237,240,238,0.5); }
.t-dot { width: 12px; height: 12px; border-radius: 50%; background: #28ae61; }
.t-line { width: 100px; height: 2px; background: rgba(237,240,238,0.1); }
.t-dot-red { width: 12px; height: 12px; border-radius: 50%; background: #c41230; }
.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-symbol img { height: 150px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.30);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="kicker">O investimento</div>
  <div class="money"><span class="accent">$</span>220M</div>
  <div class="subtitle">naming rights desde 2013</div>

  <div class="body-text">A Levi's investiu <strong>220 milhões de dólares</strong> para colocar o nome no estádio dos 49ers.</div>
  <div class="body-text">Durante a Copa 2026, a FIFA simplesmente mandou <span class="accent">tapar tudo com uma lona branca</span>.</div>

  <div class="timeline">
    <div class="t-label">2013</div>
    <div class="t-dot"></div>
    <div class="t-line"></div>
    <div class="t-label">Copa 2026</div>
    <div class="t-dot-red"></div>
  </div>

  <div class="bottom-row">
    <div class="logo-symbol">
      <img src="assets/logo-symbol-light.svg" alt="HG">
    </div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
