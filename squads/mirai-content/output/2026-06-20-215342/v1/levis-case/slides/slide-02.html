<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#0d0d0d;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:80px 70px 100px}
.bar{position:absolute;left:0;top:150px;bottom:150px;width:5px;background:#c41230}
.label{font-family:'Inter';font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:0.15em;color:rgba(255,255,255,0.3);margin-bottom:30px;position:relative;z-index:1}
.money{font-family:'Orbitron';font-weight:800;font-size:120px;color:#c41230;line-height:0.9;position:relative;z-index:1;margin-bottom:10px}
.money-label{font-family:'Inter';font-weight:500;font-size:28px;color:rgba(255,255,255,0.5);margin-bottom:50px;position:relative;z-index:1}
.body-text{font-family:'Inter';font-weight:400;font-size:30px;color:rgba(255,255,255,0.75);text-align:center;line-height:1.55;max-width:840px;position:relative;z-index:1}
.body-text strong{color:#ffffff;font-weight:600}
.body-text em{font-style:normal;color:#c41230;font-weight:600}
.timeline{display:flex;align-items:center;gap:16px;margin-top:50px;position:relative;z-index:1}
.timeline-dot{width:12px;height:12px;border-radius:50%;background:#c41230}
.timeline-line{width:120px;height:2px;background:rgba(255,255,255,0.1)}
.timeline-text{font-family:'Space Grotesk';font-weight:600;font-size:20px;color:rgba(255,255,255,0.4)}
.logo{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-family:'Space Grotesk';font-weight:700;font-size:32px;color:rgba(255,255,255,0.15)}
</style></head><body>
<div class="bar"></div>
<div class="label">O investimento</div>
<div class="money">$220M</div>
<div class="money-label">naming rights desde 2013</div>
<div class="body-text">A Levi's investiu <strong>220 milhões de dólares</strong> para colocar o nome dela no estádio dos <strong>49ers</strong>.<br><br>Durante a Copa do Mundo 2026, a FIFA simplesmente mandou <em>tapar tudo com uma lona branca</em>.</div>
<div class="timeline">
  <div class="timeline-text">2013</div>
  <div class="timeline-dot"></div>
  <div class="timeline-line"></div>
  <div class="timeline-text">Copa 2026</div>
  <div class="timeline-dot"></div>
  <div class="timeline-line"></div>
  <div class="timeline-text">🔇</div>
</div>
<div class="logo">HelloGrowth</div>
</body></html>
