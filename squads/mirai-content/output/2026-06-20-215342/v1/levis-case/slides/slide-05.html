<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#0a0a0a;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:80px 70px 100px}
.glow{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;background:radial-gradient(circle,#c41230 0%,transparent 55%);filter:blur(150px);opacity:0.1}
.tag{font-family:'Inter';font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:0.2em;color:#c41230;margin-bottom:40px;position:relative;z-index:1}
.headline{font-family:'Space Grotesk';font-weight:700;font-size:50px;color:#ffffff;text-align:center;line-height:1.15;margin-bottom:60px;position:relative;z-index:1}
.headline em{font-style:normal;color:#c41230}
.stats{display:flex;gap:40px;margin-bottom:50px;position:relative;z-index:1}
.stat-card{background:rgba(196,18,48,0.08);border:1px solid rgba(196,18,48,0.2);border-radius:24px;padding:40px 36px;text-align:center;flex:1}
.stat-icon{font-size:40px;margin-bottom:16px}
.stat-value{font-family:'Orbitron';font-weight:800;font-size:52px;color:#c41230;margin-bottom:8px}
.stat-label{font-family:'Inter';font-weight:500;font-size:20px;color:rgba(255,255,255,0.5);line-height:1.3}
.body-text{font-family:'Inter';font-weight:400;font-size:26px;color:rgba(255,255,255,0.55);text-align:center;line-height:1.5;max-width:800px;position:relative;z-index:1}
.body-text strong{color:#ffffff;font-weight:600}
.logo{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-family:'Space Grotesk';font-weight:700;font-size:32px;color:rgba(255,255,255,0.15)}
</style></head><body>
<div class="glow"></div>
<div class="tag">O resultado</div>
<div class="headline">Em menos de <em>24 horas</em></div>
<div class="stats">
  <div class="stat-card">
    <div class="stat-icon">❤️</div>
    <div class="stat-value">700K</div>
    <div class="stat-label">likes no<br>Instagram</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">▶️</div>
    <div class="stat-value">9M+</div>
    <div class="stat-label">views no<br>TikTok</div>
  </div>
</div>
<div class="body-text">Tudo isso com <strong>custo zero de mídia paga</strong>.<br>Uma foto de perfil e timing perfeito.</div>
<div class="logo">HelloGrowth</div>
</body></html>
