<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #0a5e4d;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse 700px 500px at 50% 40%, rgba(191,255,0,0.10) 0%, transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(40,174,97,0.18) 0%, transparent 55%),
    linear-gradient(160deg, #0f6652 0%, #1b6b5b 40%, #0a5e4d 100%);
  padding: 100px 80px;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}
.kicker {
  font-size: 28px; font-weight: 500; color: rgba(237,240,238,0.6);
  text-transform: uppercase; letter-spacing: 0.15em;
  margin-top: 80px; margin-bottom: 18px;
}
.title {
  font-size: 72px; font-weight: 900;
  color: #edf0ee; line-height: 1.0;
  text-transform: uppercase;
  letter-spacing: -0.04em;
  margin-bottom: 50px;
}
.title .accent { color: #bfff00; }
.stats {
  display: flex; gap: 30px;
  margin-bottom: 40px;
}
.stat-card {
  flex: 1;
  background: rgba(0,77,64,0.5);
  border: 2px solid rgba(40,174,97,0.35);
  border-radius: 24px;
  padding: 36px 28px;
  text-align: center;
}
.stat-icon { font-size: 44px; margin-bottom: 14px; }
.stat-value {
  font-size: 80px; font-weight: 900;
  color: #bfff00; line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 8px;
}
.stat-label {
  font-size: 24px; font-weight: 500;
  color: rgba(237,240,238,0.6);
  line-height: 1.3;
}
.sub {
  font-size: 32px; font-weight: 700;
  color: #edf0ee; text-align: center;
  margin-top: 20px;
}
.sub .accent { color: #bfff00; }
.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-symbol img { height: 150px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.30);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="kicker">O resultado</div>
  <div class="title">EM MENOS DE <span class="accent">24 HORAS</span></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon">❤️</div>
      <div class="stat-value">700K</div>
      <div class="stat-label">likes no<br>Instagram</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">▶️</div>
      <div class="stat-value">9M+</div>
      <div class="stat-label">views no<br>TikTok</div>
    </div>
  </div>

  <div class="sub">Tudo com <span class="accent">custo zero</span> de mídia paga.</div>

  <div class="bottom-row">
    <div class="logo-symbol">
      <img src="assets/logo-symbol-light.svg" alt="HG">
    </div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
