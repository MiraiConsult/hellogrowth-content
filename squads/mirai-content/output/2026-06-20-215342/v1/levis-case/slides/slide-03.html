<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#0a0a0a;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:80px 70px 100px}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,#c41230 0%,transparent 60%);filter:blur(160px);opacity:0.08}
.headline{font-family:'Space Grotesk';font-weight:700;font-size:52px;color:#ffffff;text-align:center;line-height:1.15;position:relative;z-index:1;margin-bottom:50px;max-width:860px}
.headline em{font-style:normal;color:#c41230}
.body-text{font-family:'Inter';font-weight:400;font-size:30px;color:rgba(255,255,255,0.7);text-align:center;line-height:1.55;max-width:800px;position:relative;z-index:1}
.body-text strong{color:#ffffff;font-weight:600}
.divider{width:60px;height:3px;background:#c41230;margin:50px 0;position:relative;z-index:1}
.quote{font-family:'Space Grotesk';font-weight:600;font-size:34px;color:rgba(255,255,255,0.5);text-align:center;position:relative;z-index:1;font-style:italic;max-width:750px;line-height:1.4}
.logo{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-family:'Space Grotesk';font-weight:700;font-size:32px;color:rgba(255,255,255,0.15)}
</style></head><body>
<div class="glow"></div>
<div class="headline">O que parece <em>brilhante e espontâneo</em> foi, na verdade, estratégia.</div>
<div class="body-text">A Levi's <strong>sabia desde muito antes</strong> que seu logo seria coberto.<br><br>Em vez de reclamar, planejaram cada passo do que fariam <strong>quando</strong> isso acontecesse.</div>
<div class="divider"></div>
<div class="quote">"A sorte favorece quem se prepara."</div>
<div class="logo">HelloGrowth</div>
</body></html>
