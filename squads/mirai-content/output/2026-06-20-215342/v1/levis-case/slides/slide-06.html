<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#0d0d0d;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:80px 70px 100px}
.content{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.headline{font-family:'Space Grotesk';font-weight:700;font-size:64px;color:#ffffff;line-height:1.1;margin-bottom:20px}
.headline em{font-style:normal;color:#c41230}
.sub{font-family:'Space Grotesk';font-weight:700;font-size:64px;color:#c41230;line-height:1.1;margin-bottom:50px}
.divider{width:60px;height:3px;background:rgba(255,255,255,0.15);margin-bottom:50px}
.body-text{font-family:'Inter';font-weight:400;font-size:30px;color:rgba(255,255,255,0.7);text-align:center;line-height:1.55;max-width:800px;margin-bottom:20px}
.body-text strong{color:#ffffff;font-weight:600}
.callout{font-family:'Inter';font-weight:600;font-size:28px;color:rgba(255,255,255,0.5);text-align:center;line-height:1.5;max-width:780px;margin-top:30px;padding:30px 40px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03)}
.callout em{font-style:normal;color:#f59e0b}
.logo{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-family:'Space Grotesk';font-weight:700;font-size:32px;color:rgba(255,255,255,0.15)}
</style></head><body>
<div class="content">
  <div class="headline">Não foi sorte.</div>
  <div class="sub">Foi processo.</div>
  <div class="divider"></div>
  <div class="body-text">Eles <strong>já sabiam o que fariam</strong> quando o logo sumisse.</div>
  <div class="body-text">Tinham um plano antes de precisar improvisar.</div>
  <div class="callout">A sua clínica também precisa de um plano — <em>antes de precisar improvisar.</em></div>
</div>
<div class="logo">HelloGrowth</div>
</body></html>
