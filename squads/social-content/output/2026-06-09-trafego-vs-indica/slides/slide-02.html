<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #e0eadb; font-family: 'Inter', sans-serif; color: #004d40; overflow: hidden; letter-spacing: -0.02em; }
.card { width: 1080px; height: 1350px; position: relative; background: linear-gradient(180deg, #f2f7ee 0%, #e8ede5 50%, #e0eadb 100%); }
.orb { position: absolute; border-radius: 50%; }
.orb1 { width: 626px; height: 600px; left: -86px; top: 100px; background: rgba(191,255,0,0.2); filter: blur(250px); }
.orb2 { width: 556px; height: 562px; left: 600px; top: 700px; background: rgba(40,174,97,0.18); filter: blur(250px); }
.handle { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 500; color: rgba(0,77,64,0.4); letter-spacing: 0.05em; }

/* Two columns */
.col-wrap { position: absolute; left: 60px; top: 140px; right: 60px; display: flex; gap: 24px; }
.col { flex: 1; border-radius: 24px; padding: 36px 30px; }
.col.paid { background: rgba(0,77,64,0.06); border: 2px solid rgba(0,77,64,0.12); }
.col.organic { background: #004d40; color: #edf0ed; box-shadow: 0 14px 40px rgba(0,77,64,0.30); }
.col-tag { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 20px; }
.col.paid .col-tag { color: rgba(0,77,64,0.5); }
.col.organic .col-tag { color: #bfff00; }
.col-icon { font-size: 48px; margin-bottom: 20px; }
.col-title { font-size: 32px; font-weight: 900; line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 14px; }
.col-body { font-size: 22px; font-weight: 500; line-height: 1.45; }
.col.paid .col-body { color: rgba(0,77,64,0.6); }
.col.organic .col-body { color: rgba(237,240,237,0.7); }

.vs-label { position: absolute; left: 50%; top: 140px; transform: translateX(-50%); margin-top: 420px;
  font-size: 24px; font-weight: 900; color: #28ae61; background: #e0eadb; padding: 8px 20px; border-radius: 50px; border: 2px solid #28ae61; z-index: 2; }

/* Bottom text */
.insight { position: absolute; left: 80px; top: 650px; width: 920px; font-size: 40px; font-weight: 800; color: #004d40; line-height: 1.25; letter-spacing: -0.03em; }
.insight .hl { background: #bfff00; padding: 2px 12px; }
.detail { position: absolute; left: 80px; top: 810px; width: 920px; font-size: 34px; font-weight: 500; color: #1b6b5b; line-height: 1.4; }

.logo-wrap { position: absolute; left: 44px; top: 1075px; }
.logo-wrap img { height: 165px; }
.arrow-wrap { position: absolute; right: 80px; bottom: 130px; }
.arrow-circle { width: 84px; height: 84px; background: #28ae61; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.arrow-circle svg { width: 36px; height: 36px; }
</style>
</head>
<body>
<div class="card">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="handle">@hellogrowth__</div>

  <div class="col-wrap">
    <div class="col paid">
      <div class="col-tag">Tráfego pago</div>
      <div class="col-icon">💰</div>
      <div class="col-title">Paga por<br>cada clique</div>
      <div class="col-body">Compete com todo mundo.<br>Para de pagar, para de aparecer.</div>
    </div>
    <div class="col organic">
      <div class="col-tag">Indicação</div>
      <div class="col-icon">🤝</div>
      <div class="col-title">Já chega<br>confiando</div>
      <div class="col-body">Alguém que ele respeita<br>falou de você. Custo zero.</div>
    </div>
  </div>

  <div class="vs-label">VS</div>

  <div class="insight">Na indicação, o paciente chega<br>com a <span class="hl">decisão quase tomada.</span></div>
  <div class="detail">Não precisa convencer.<br>Precisa só não estragar.</div>

  <div class="logo-wrap"><img src="assets/logo-symbol.svg" alt="HG"></div>
  <div class="arrow-wrap">
    <div class="arrow-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#edf0ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </div>
  </div>
</div>
</body>
</html>
