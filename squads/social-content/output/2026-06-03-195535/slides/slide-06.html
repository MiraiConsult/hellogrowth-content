<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px;
  height: 1350px;
  background: #0a0a0a;
  font-family: 'Montserrat', sans-serif;
  color: #ffffff;
  overflow: hidden;
}
.card {
  width: 1080px;
  height: 1350px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 70px 65px;
}
.bg-orb1 {
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(45,125,95,0.25) 0%, transparent 70%);
  top: 100px;
  left: -80px;
  filter: blur(80px);
}
.bg-orb2 {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(108,207,170,0.2) 0%, transparent 70%);
  bottom: 50px;
  right: -50px;
  filter: blur(70px);
}
.handle {
  position: absolute;
  top: 40px;
  left: 65px;
  font-weight: 500;
  font-size: 18px;
  color: rgba(255,255,255,0.35);
  z-index: 10;
}
.content { position: relative; z-index: 5; }
.title {
  font-weight: 900;
  font-size: 38px;
  margin-bottom: 50px;
  line-height: 1.3;
}
.title .green {
  background: linear-gradient(135deg, #6CCFAA, #A0E8CC);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 22px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 20px;
  padding: 28px 30px;
  margin-bottom: 18px;
}
.check-icon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  background: linear-gradient(135deg, #2D7D5F, #3BAA7A);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 700;
  margin-top: 2px;
  box-shadow: 0 0 15px rgba(59,170,122,0.3);
}
.check-text {
  font-weight: 700;
  font-size: 30px;
  line-height: 1.3;
}
.check-sub {
  font-weight: 400;
  font-size: 24px;
  color: rgba(255,255,255,0.4);
  margin-top: 4px;
}
.bottom {
  margin-top: 40px;
  text-align: center;
}
.bottom-text {
  font-weight: 900;
  font-size: 28px;
  background: linear-gradient(90deg, #6CCFAA, #3BAA7A);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="card">
  <div class="bg-orb1"></div>
  <div class="bg-orb2"></div>
  <div class="handle">@hellogrowth__</div>
  <div class="content">
    <div class="title">3 ações que valem<br><span class="green">R$45 mil</span> este ano:</div>
    <div class="check-item">
      <div class="check-icon">✓</div>
      <div>
        <div class="check-text">Peça avaliações</div>
        <div class="check-sub">após cada entrega</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-icon">✓</div>
      <div>
        <div class="check-text">Responda 100%</div>
        <div class="check-sub">das reviews em 24h</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-icon">✓</div>
      <div>
        <div class="check-text">Monitore sua nota</div>
        <div class="check-sub">toda semana</div>
      </div>
    </div>
    <div class="bottom">
      <div class="bottom-text">SIMPLES. COMPROVADO. LUCRATIVO.</div>
    </div>
  </div>
</div>
</body>
</html>
