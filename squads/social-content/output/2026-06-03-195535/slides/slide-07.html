<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px;
  height: 1350px;
  background: #0a0a0a;
  font-family: 'Montserrat', sans-serif;
  color: #ffffff;
  overflow: hidden;
}
.card {
  width: 1080px;
  height: 1350px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.bg-orb1 {
  position: absolute;
  width: 800px;
  height: 800px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(45,125,95,0.5) 0%, transparent 70%);
  top: -150px;
  left: -100px;
  filter: blur(100px);
}
.bg-orb2 {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(108,207,170,0.35) 0%, transparent 70%);
  bottom: -100px;
  right: -100px;
  filter: blur(90px);
}
.bg-orb3 {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(160,232,204,0.2) 0%, transparent 70%);
  top: 500px;
  left: 350px;
  filter: blur(60px);
}
.handle {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 500;
  font-size: 18px;
  color: rgba(255,255,255,0.4);
  z-index: 10;
}
.content {
  position: relative;
  z-index: 5;
  padding: 0 65px;
}
.glass-panel {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 32px;
  padding: 60px 50px;
  margin-bottom: 50px;
}
.question {
  font-weight: 900;
  font-size: 48px;
  line-height: 1.25;
  margin-bottom: 30px;
}
.answer {
  font-weight: 400;
  font-size: 28px;
  line-height: 1.6;
  color: rgba(255,255,255,0.7);
}
.answer strong {
  font-weight: 700;
  color: #ffffff;
}
.glow-divider {
  width: 100px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #6CCFAA, transparent);
  margin: 0 auto 40px;
  box-shadow: 0 0 25px rgba(108,207,170,0.4);
}
.cta-row {
  display: flex;
  gap: 25px;
  justify-content: center;
  margin-bottom: 45px;
}
.cta-pill {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 50px;
  padding: 14px 28px;
  font-weight: 500;
  font-size: 24px;
  color: rgba(255,255,255,0.6);
}
.brand {
  font-weight: 900;
  font-size: 24px;
  background: linear-gradient(135deg, #6CCFAA, #A0E8CC);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 3px;
}
</style>
</head>
<body>
<div class="card">
  <div class="bg-orb1"></div>
  <div class="bg-orb2"></div>
  <div class="bg-orb3"></div>
  <div class="handle">@hellogrowth__</div>
  <div class="content">
    <div class="glass-panel">
      <div class="question">Quanto vale<br>1 estrela pro<br>seu negócio?</div>
      <div class="answer">A <strong>HelloGrowth</strong> te ajuda<br>a construir reputação<br>que vende.</div>
    </div>
    <div class="glow-divider"></div>
    <div class="cta-row">
      <span class="cta-pill">🔗 Link na bio</span>
      <span class="cta-pill">💾 Salva pra depois</span>
    </div>
    <div class="brand">@HELLOGROWTH__</div>
  </div>
</div>
</body>
</html>
