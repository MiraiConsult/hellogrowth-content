<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 7700px;
  height: 1400px;
  background: #1a1a1a;
  overflow: hidden;
}
.strip {
  display: flex;
  gap: 20px;
  padding: 25px;
  height: 1400px;
  align-items: center;
}
.strip img {
  height: 1350px;
  width: 1080px;
  object-fit: cover;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="strip">
  <img src="slide-01.png">
  <img src="slide-02.png">
  <img src="slide-03.png">
  <img src="slide-04.png">
  <img src="slide-05.png">
  <img src="slide-06.png">
  <img src="slide-07.png">
</div>
</body>
</html>
