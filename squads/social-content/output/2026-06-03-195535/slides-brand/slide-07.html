<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top, rgba(191,255,0,0.10) 0%, transparent 60%),
    radial-gradient(ellipse at bottom left, rgba(40,174,97,0.30) 0%, transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(40,174,97,0.25) 0%, transparent 55%),
    linear-gradient(160deg, #004d40 0%, #1b6b5b 60%, #004d40 100%);
  display: flex; flex-direction: column;
  align-items: center; padding: 90px 80px;
}
.noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
  opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}
.content-wrap {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.icon-arrow {
  margin-bottom: 50px;
  filter: drop-shadow(0 0 35px rgba(191,255,0,0.35));
}
.icon-arrow svg { width: 200px; height: 200px; }
.pre-headline {
  font-size: 32px; font-weight: 400; color: #edf0ee;
  text-align: center; margin-bottom: 24px;
}
.headline {
  font-size: 78px; font-weight: 900; text-transform: uppercase;
  text-align: center; line-height: 1; margin-bottom: 28px;
  letter-spacing: -0.035em;
}
.pilula {
  display: inline-block;
  background: #bfff00; color: #004d40;
  font-weight: 900; font-size: 58px; text-transform: uppercase;
  padding: 16px 38px; border-radius: 100px;
  letter-spacing: -0.03em; line-height: 1;
  box-shadow: 0 0 60px rgba(191,255,0,0.35);
}
.sub {
  font-size: 28px; font-weight: 500; color: rgba(237,240,238,0.85);
  text-align: center; margin-top: 44px; line-height: 1.5;
  max-width: 800px;
}
.sub .accent { color: #bfff00; font-weight: 700; }
.logo-big {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  font-size: 56px; font-weight: 700; letter-spacing: -0.02em;
}
.logo-big .hello { color: #edf0ee; }
.logo-big .growth { color: #28ae61; }
</style>
</head>
<body>
<div class="card">
  <div class="noise"></div>
  <div class="handle">@hellogrowth__</div>
  <div class="content-wrap">
    <div class="icon-arrow">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#bfff00" stroke-width="4" opacity="0.5"/>
        <circle cx="50" cy="50" r="36" fill="#bfff00" opacity="0.12"/>
        <path d="M 30 50 L 65 50 M 50 35 L 65 50 L 50 65" stroke="#bfff00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="pre-headline">Quanto vale 1 estrela</div>
    <div class="headline">PRO SEU<br>NEGÓCIO?</div>
    <div class="pilula">VAMOS DESCOBRIR JUNTOS</div>
    <div class="sub">Reputação que vende. <span class="accent">Link na bio</span>.<br>Salva esse post pra aplicar depois.</div>
  </div>
  <div class="logo-big"><span class="hello">Hello</span><span class="growth">Growth</span></div>
</div>
</body>
</html>
