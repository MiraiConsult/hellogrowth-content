<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #edf0ee;
  font-family: 'Inter', sans-serif;
  color: #004d40;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse 900px 700px at top left, rgba(191,255,0,0.32) 0%, transparent 60%),
    radial-gradient(ellipse 700px 800px at bottom right, rgba(40,174,97,0.18) 0%, transparent 65%),
    linear-gradient(180deg, #f7faf5 0%, #edf0ee 100%);
  padding: 80px 80px;
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(0,77,64,0.4);
  letter-spacing: 0.05em;
}

/* Harvard tag */
.harvard-tag {
  display: inline-flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.7);
  border: 2px solid rgba(164,30,34,0.25);
  border-radius: 100px;
  padding: 12px 28px 12px 14px;
  margin-top: 90px; margin-bottom: 50px;
  backdrop-filter: blur(6px);
}
.harvard-shield {
  width: 44px; height: 50px;
  background: #A41E22;
  clip-path: polygon(0 0, 100% 0, 100% 72%, 50% 100%, 0 72%);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 4px;
  font-family: 'Playfair Display', serif;
  font-weight: 900; font-size: 24px;
  color: #edf0ee;
}
.harvard-text { display: flex; flex-direction: column; line-height: 1; }
.harvard-name {
  font-family: 'Playfair Display', serif;
  font-weight: 700; font-size: 22px;
  color: #A41E22; letter-spacing: 0;
}
.harvard-sub {
  font-family: 'Inter', sans-serif;
  font-size: 12px; font-weight: 600;
  color: rgba(164,30,34,0.7);
  letter-spacing: 0.2em; text-transform: uppercase;
  margin-top: 4px;
}

/* Main headline */
.kicker {
  font-size: 36px; font-weight: 600;
  color: #1b6b5b; line-height: 1.2; margin-bottom: 14px;
}
.headline-mega {
  font-size: 220px; font-weight: 900;
  color: #004d40; line-height: 0.88; margin-bottom: 0;
  letter-spacing: -0.065em;
}
.headline-mega .ano {
  font-size: 96px; display: block; line-height: 1.05;
  letter-spacing: -0.045em;
}
.context {
  font-size: 38px; font-weight: 600;
  color: #1b6b5b; line-height: 1.25;
  margin-top: 38px; margin-bottom: 16px;
}
.pilula {
  display: inline-block;
  background: #bfff00;
  font-size: 44px; font-weight: 800;
  color: #004d40; line-height: 1;
  padding: 12px 26px;
  letter-spacing: -0.025em;
  text-transform: uppercase;
  box-shadow: 6px 6px 0 rgba(40,174,97,0.30);
}

/* Bottom row: logo full + arrow */
.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-full {
  display: flex; align-items: center; gap: 16px;
}
.logo-full img { height: 72px; }
.logo-wordmark {
  font-family: 'Inter', sans-serif;
  font-weight: 900; font-size: 56px;
  line-height: 1; letter-spacing: -0.045em;
}
.logo-wordmark .hello { color: #1b6b5b; }
.logo-wordmark .growth { color: #28ae61; }
.arrow-next {
  width: 92px; height: 92px;
  background: #28ae61;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 28px rgba(40,174,97,0.40);
}
.arrow-next svg { width: 40px; height: 40px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="harvard-tag">
    <div class="harvard-shield">H</div>
    <div class="harvard-text">
      <span class="harvard-name">Harvard</span>
      <span class="harvard-sub">Business School</span>
    </div>
  </div>

  <div class="kicker">descobriu que cada estrela a mais vale</div>
  <div class="headline-mega">+R$45K<span class="ano">por ano</span></div>

  <div class="context">no faturamento da sua empresa.</div>
  <div class="pilula">Sem 1 real em anúncio</div>

  <div class="bottom-row">
    <div class="logo-full">
      <img src="assets/logo-full.svg" alt="HelloGrowth" style="height: 90px;">
    </div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#edf0ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
