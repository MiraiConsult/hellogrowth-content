<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #edf0ee;
  font-family: 'Inter', sans-serif;
  color: #004d40;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse 700px 600px at top left, rgba(191,255,0,0.30) 0%, transparent 60%),
    radial-gradient(ellipse 600px 700px at bottom right, rgba(40,174,97,0.18) 0%, transparent 65%),
    linear-gradient(180deg, #f5f8f3 0%, #edf0ee 100%);
  padding: 100px 80px;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(0,77,64,0.4);
  letter-spacing: 0.05em;
}
.content {
  margin-top: 280px;
}
.kicker {
  font-size: 64px; font-weight: 900;
  color: #004d40; line-height: 1; margin-bottom: 14px;
  letter-spacing: -0.04em;
}
.line-1 {
  font-size: 50px; font-weight: 800;
  color: #004d40; line-height: 1.15; margin-bottom: 14px;
  letter-spacing: -0.03em;
}
.highlight-pill {
  display: inline-block;
  background: #bfff00;
  font-size: 50px; font-weight: 800;
  color: #004d40; line-height: 1.15;
  padding: 4px 22px;
  letter-spacing: -0.03em;
  box-shadow: 4px 4px 0 rgba(40,174,97,0.25);
  margin-bottom: 20px;
}
.sub {
  font-size: 32px; font-weight: 600;
  color: #28ae61; line-height: 1.3;
  letter-spacing: -0.02em;
}
.logo {
  position: absolute; bottom: 120px; left: 80px;
  display: flex; align-items: center; gap: 10px;
}
.logo-icon {
  width: 38px; height: 38px;
  background: #1b6b5b;
  border-radius: 12px 12px 12px 4px;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon::before {
  content: ''; width: 14px; height: 3px; background: #bfff00; border-radius: 2px;
}
.logo-text {
  font-size: 40px; font-weight: 800;
  color: #1b6b5b; letter-spacing: -0.025em;
}
.logo-text .g-mark { position: relative; }
.logo-text .g-mark::after {
  content: ''; position: absolute;
  width: 8px; height: 8px;
  background: #bfff00;
  top: 50%; left: 50%;
  transform: translate(-30%, -45%) rotate(45deg);
}
.arrow-next {
  position: absolute; bottom: 120px; right: 80px;
  width: 80px; height: 80px;
  background: #28ae61;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(40,174,97,0.35);
}
.arrow-next svg { width: 36px; height: 36px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>
  <div class="content">
    <div class="kicker">+R$45 mil</div>
    <div class="line-1">por ano é o que</div>
    <div class="highlight-pill">1 estrela a mais vale</div>
    <div class="sub">no seu negócio. E Harvard provou.</div>
  </div>

  <div class="logo">
    <div class="logo-icon"></div>
    <div class="logo-text">Hello<span class="g-mark">G</span>rowth</div>
  </div>

  <div class="arrow-next">
    <svg viewBox="0 0 24 24" fill="none" stroke="#edf0ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </div>
</div>
</body>
</html>
