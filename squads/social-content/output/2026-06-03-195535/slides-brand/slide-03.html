<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.20) 0%, transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(40,174,97,0.18) 0%, transparent 55%),
    linear-gradient(160deg, #1b6b5b 0%, #004d40 70%);
  padding: 100px 80px;
}
.noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
  opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}

.kicker {
  font-size: 30px; font-weight: 500; color: rgba(237,240,238,0.65);
  text-transform: uppercase; letter-spacing: 0.15em;
  margin-top: 90px; margin-bottom: 14px;
}
.title {
  font-size: 60px; font-weight: 900;
  color: #edf0ee; line-height: 1.05; margin-bottom: 50px;
  letter-spacing: -0.04em;
}
.title .accent { color: #bfff00; }

.calc-box {
  background: rgba(0,77,64,0.5);
  border: 2px solid rgba(40,174,97,0.4);
  border-radius: 24px;
  padding: 38px 42px;
  margin-bottom: 28px;
}
.calc-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 20px 0;
  border-bottom: 1px solid rgba(237,240,238,0.1);
}
.calc-row:last-child { border-bottom: none; }
.calc-label { font-size: 28px; font-weight: 500; color: rgba(237,240,238,0.7); }
.calc-value { font-size: 40px; font-weight: 900; color: #edf0ee; }
.equals {
  text-align: center;
  font-size: 56px; color: #bfff00; margin: 10px 0;
  font-weight: 900; line-height: 1;
}
.result-pilula {
  display: block; text-align: center;
  background: #bfff00; color: #004d40;
  font-weight: 900; font-size: 80px;
  padding: 24px 40px; border-radius: 100px;
  letter-spacing: -0.04em; line-height: 1;
  text-transform: uppercase;
  box-shadow: 0 12px 50px rgba(191,255,0,0.3);
}
.sub {
  font-size: 30px; font-weight: 700; color: #edf0ee;
  text-align: center; margin-top: 30px;
}
.sub .accent { color: #bfff00; }

.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-symbol-only img { height: 120px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.30);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="noise"></div>
  <div class="handle">@hellogrowth__</div>

  <div class="kicker">faz a conta</div>
  <div class="title">Empresa que fatura<br><span class="accent">R$500k/ano</span> ganha:</div>

  <div class="calc-box">
    <div class="calc-row">
      <span class="calc-label">Faturamento anual</span>
      <span class="calc-value">R$500.000</span>
    </div>
    <div class="calc-row">
      <span class="calc-label">+1 estrela no Google</span>
      <span class="calc-value">+5 a 9%</span>
    </div>
  </div>
  <div class="equals">↓</div>
  <div class="result-pilula">+R$25K a R$45K</div>
  <div class="sub">Sem gastar <span class="accent">1 real</span> em anúncio.</div>

  <div class="bottom-row">
    <div class="logo-symbol-only">
      <img src="assets/logo-symbol-light.svg" alt="HG">
    </div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
