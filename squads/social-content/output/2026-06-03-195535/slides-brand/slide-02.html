<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.25) 0%, transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(40,174,97,0.18) 0%, transparent 55%),
    linear-gradient(160deg, #004d40 0%, #1b6b5b 60%, #004d40 100%);
  padding: 100px 80px;
}
.noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
  opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}

/* Harvard integrado à frase */
.intro-line {
  margin-top: 110px; margin-bottom: 30px;
  font-size: 32px; font-weight: 400;
  color: #edf0ee; line-height: 1.5;
}
.intro-line .harvard-inline {
  display: inline-flex; align-items: center; gap: 22px;
  vertical-align: middle;
  background: rgba(164,30,34,0.22);
  border: 3px solid rgba(164,30,34,0.55);
  border-radius: 100px;
  padding: 22px 44px 22px 30px;
  margin-right: 6px;
}
.intro-line .harvard-shield-small {
  width: 70px; height: 80px;
  background: #A41E22;
  clip-path: polygon(0 0, 100% 0, 100% 72%, 50% 100%, 0 72%);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 8px;
  font-family: 'Playfair Display', serif;
  font-weight: 900; font-size: 38px;
  color: #edf0ee;
  flex-shrink: 0;
}
.intro-line .harvard-name-inline {
  font-family: 'Playfair Display', serif;
  font-weight: 700; font-size: 54px;
  color: #edf0ee; letter-spacing: 0;
  line-height: 1;
}
.intro-line .accent { color: #bfff00; font-weight: 700; }

.headline-big {
  font-size: 240px; font-weight: 900;
  color: #bfff00; line-height: 0.95; margin-top: 30px; margin-bottom: 14px;
  letter-spacing: -0.045em;
  text-shadow: 0 0 60px rgba(191,255,0,0.25);
}
.headline {
  font-size: 50px; font-weight: 900; text-transform: uppercase;
  line-height: 1.05; letter-spacing: -0.035em;
}
.sub {
  font-size: 24px; font-weight: 500;
  color: rgba(237,240,238,0.55);
  margin-top: 30px; line-height: 1.4; font-style: italic;
}

.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-symbol-only img { height: 150px; }
.logo-symbol-only { display: flex; align-items: center; }
.arrow-next {
  width: 84px; height: 84px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.30);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="noise"></div>
  <div class="handle">@hellogrowth__</div>

  <div class="intro-line">
    <span class="harvard-inline">
      <span class="harvard-shield-small">H</span>
      <span class="harvard-name-inline">Harvard</span>
    </span><br>analisou <span class="accent">milhares de empresas</span> e descobriu:
  </div>

  <div class="headline-big">+5 a 9%</div>
  <div class="headline">DE RECEITA POR<br>CADA ESTRELA A MAIS</div>
  <div class="sub">Não é palpite. É estudo seminal de reputação corporativa.</div>

  <div class="bottom-row">
    <div class="logo-symbol-only">
      <img src="assets/logo-symbol-light.svg" alt="HG">
    </div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
