<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.25) 0%, transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(40,174,97,0.18) 0%, transparent 55%),
    linear-gradient(160deg, #004d40 0%, #1b6b5b 60%, #004d40 100%);
  padding: 100px 80px;
}
.noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
  opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}
.harvard-tag {
  margin-top: 120px;
  display: flex; align-items: center; gap: 18px;
  margin-bottom: 60px;
}
.harvard-shield {
  width: 70px; height: 80px;
  background: #A41E22;
  clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%);
  display: flex; align-items: center; justify-content: center;
  padding-bottom: 10px;
  font-family: 'Playfair Display', serif;
  font-weight: 900; font-size: 36px;
  color: #edf0ee;
}
.harvard-info {
  display: flex; flex-direction: column;
}
.harvard-name {
  font-family: 'Playfair Display', serif;
  font-weight: 700; font-size: 32px;
  color: #edf0ee; letter-spacing: 0;
}
.harvard-sub {
  font-size: 18px; font-weight: 500;
  color: rgba(237,240,238,0.5);
  letter-spacing: 0.15em; text-transform: uppercase;
  margin-top: 2px;
}
.pre-headline {
  font-size: 32px; font-weight: 400;
  color: #edf0ee; margin-bottom: 30px; line-height: 1.35;
}
.pre-headline .accent { color: #bfff00; font-weight: 700; }
.headline-big {
  font-size: 230px; font-weight: 900;
  color: #bfff00; line-height: 0.95; margin-bottom: 8px;
  letter-spacing: -0.06em;
  text-shadow: 0 0 60px rgba(191,255,0,0.25);
}
.headline {
  font-size: 54px; font-weight: 900; text-transform: uppercase;
  line-height: 1.05; letter-spacing: -0.035em;
}
.sub {
  font-size: 26px; font-weight: 500;
  color: rgba(237,240,238,0.65);
  margin-top: 34px; line-height: 1.4; font-style: italic;
}
.logo {
  position: absolute; bottom: 120px; left: 80px;
  display: flex; align-items: center; gap: 10px;
}
.logo-icon {
  width: 38px; height: 38px;
  background: #edf0ee;
  border-radius: 12px 12px 12px 4px;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon::before {
  content: ''; width: 14px; height: 3px; background: #bfff00; border-radius: 2px;
}
.logo-text {
  font-size: 40px; font-weight: 800;
  color: #edf0ee; letter-spacing: -0.025em;
}
.logo-text .g-mark { position: relative; }
.logo-text .g-mark::after {
  content: ''; position: absolute;
  width: 8px; height: 8px;
  background: #bfff00;
  top: 50%; left: 50%;
  transform: translate(-30%, -45%) rotate(45deg);
}
.arrow-next {
  position: absolute; bottom: 120px; right: 80px;
  width: 80px; height: 80px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.3);
}
.arrow-next svg { width: 36px; height: 36px; }
</style>
</head>
<body>
<div class="card">
  <div class="noise"></div>
  <div class="handle">@hellogrowth__</div>

  <div class="harvard-tag">
    <div class="harvard-shield">H</div>
    <div class="harvard-info">
      <div class="harvard-name">Harvard</div>
      <div class="harvard-sub">Business School</div>
    </div>
  </div>

  <div class="pre-headline">analisou <span class="accent">milhares de empresas</span> e encontrou:</div>
  <div class="headline-big">+5–9%</div>
  <div class="headline">DE RECEITA POR<br>CADA ESTRELA A MAIS</div>
  <div class="sub">Não é palpite. É estudo seminal de reputação corporativa.</div>

  <div class="logo">
    <div class="logo-icon"></div>
    <div class="logo-text">Hello<span class="g-mark">G</span>rowth</div>
  </div>

  <div class="arrow-next">
    <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </div>
</div>
</body>
</html>
