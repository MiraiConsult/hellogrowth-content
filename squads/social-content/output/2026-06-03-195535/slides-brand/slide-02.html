<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top left, rgba(40,174,97,0.22) 0%, transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(40,174,97,0.18) 0%, transparent 50%),
    linear-gradient(180deg, #004d40 0%, #1b6b5b 100%);
  display: flex; flex-direction: column;
  align-items: center; padding: 90px 80px;
}
.noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
  opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}
.content-wrap {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.icon-chart {
  margin-bottom: 60px;
  filter: drop-shadow(0 0 30px rgba(191,255,0,0.3));
}
.icon-chart svg { width: 240px; height: 200px; }
.pre-headline {
  font-size: 30px; font-weight: 400; color: #edf0ee;
  text-align: center; margin-bottom: 24px; line-height: 1.35;
}
.pre-headline .accent { color: #bfff00; font-weight: 700; }
.headline-big {
  font-size: 180px; font-weight: 900; color: #bfff00;
  text-align: center; line-height: 1; margin-bottom: 16px;
  letter-spacing: -0.05em;
  text-shadow: 0 0 60px rgba(191,255,0,0.25);
}
.headline {
  font-size: 50px; font-weight: 900; text-transform: uppercase;
  text-align: center; line-height: 1.05;
  letter-spacing: -0.03em;
}
.sub {
  font-size: 26px; font-weight: 500; color: rgba(237,240,238,0.7);
  text-align: center; margin-top: 36px; line-height: 1.4;
}
.logo {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  font-size: 44px; font-weight: 700; letter-spacing: -0.02em;
}
.logo .hello { color: #edf0ee; }
.logo .growth { color: #28ae61; }
</style>
</head>
<body>
<div class="card">
  <div class="noise"></div>
  <div class="handle">@hellogrowth__</div>
  <div class="content-wrap">
    <div class="icon-chart">
      <svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="140" width="40" height="60" rx="6" fill="#28ae61" opacity="0.5"/>
        <rect x="50" y="110" width="40" height="90" rx="6" fill="#28ae61" opacity="0.7"/>
        <rect x="100" y="75" width="40" height="125" rx="6" fill="#28ae61"/>
        <rect x="150" y="40" width="40" height="160" rx="6" fill="#bfff00" opacity="0.85"/>
        <rect x="200" y="0" width="40" height="200" rx="6" fill="#bfff00"/>
        <path d="M 20 130 L 70 100 L 120 65 L 170 30 L 220 -10" stroke="#bfff00" stroke-width="4" fill="none" stroke-linecap="round" opacity="0"/>
      </svg>
    </div>
    <div class="pre-headline">Harvard analisou <span class="accent">milhares de empresas</span></div>
    <div class="headline-big">+5 A 9%</div>
    <div class="headline">DE RECEITA POR ESTRELA</div>
    <div class="sub">Isso não é opinião. É dado.</div>
  </div>
  <div class="logo"><span class="hello">Hello</span><span class="growth">Growth</span></div>
</div>
</body>
</html>
