<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" fill="none">
  <!-- Chat bubble outline -->
  <path d="M 30 25 H 165 Q 182 25 182 42 V 178 Q 182 195 165 195 H 88 L 48 235 L 60 195 H 47 Q 30 195 30 178 V 42 Q 30 25 47 25 Z"
        fill="#ffffff" stroke="#28ae61" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- H letter -->
  <path d="M 56 58 H 92 V 105 H 125 V 58 H 161 V 162 H 125 V 132 H 92 V 162 H 56 Z" fill="#1b6b5b"/>

  <!-- G + arrow + star group -->
  <g transform="translate(205, 38)">
    <!-- 1. Solid green circle -->
    <circle cx="80" cy="80" r="80" fill="#28ae61"/>
    <!-- 2. Donut hole -->
    <circle cx="80" cy="80" r="42" fill="#ffffff"/>
    <!-- 3. Small opening notch on the right (small step at bottom-right of bar) -->
    <path d="M 130 96 L 165 96 L 165 130 L 130 130 Z" fill="#ffffff"/>
    <!-- 4. G crossbar (horizontal arm of the G) -->
    <rect x="78" y="64" width="62" height="32" fill="#28ae61"/>

    <!-- 5. Arrow shaft (diagonal up-right, emerging from top of G) -->
    <path d="M 112 50 L 178 -16 L 198 4 L 132 70 Z" fill="#28ae61"/>
    <!-- 6. Arrow head (right-angle pointing up-right) -->
    <path d="M 152 -32 L 210 -32 L 210 26 L 188 4 L 172 -12 L 152 -12 Z" fill="#28ae61"/>

    <!-- 7. Star above arrow tip -->
    <path d="M 200 -56 L 206 -42 L 222 -42 L 209 -32 L 214 -16 L 200 -26 L 186 -16 L 191 -32 L 178 -42 L 194 -42 Z"
          fill="#bfff00"/>
  </g>
</svg>
