<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at bottom left, rgba(40,174,97,0.15) 0%, transparent 55%),
    linear-gradient(160deg, #004d40 0%, #1b6b5b 50%, #004d40 100%);
  padding: 100px 80px;
}
.noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
  opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}

.stars-row {
  display: flex; gap: 16px; margin-top: 100px; margin-bottom: 56px;
  filter: drop-shadow(0 0 25px rgba(191,255,0,0.2));
}
.stars-row svg { width: 108px; height: 108px; }
.star-active { fill: #bfff00; }
.star-dim { fill: rgba(237,240,238,0.18); }

.pre-headline {
  font-size: 34px; font-weight: 400; color: #edf0ee;
  margin-bottom: 16px; line-height: 1.3;
}
.headline-big {
  font-size: 260px; font-weight: 900;
  color: #bfff00; line-height: 0.95; margin-bottom: 8px;
  letter-spacing: -0.06em;
  text-shadow: 0 0 60px rgba(191,255,0,0.3);
}
.headline {
  font-size: 58px; font-weight: 900; text-transform: uppercase;
  line-height: 1.05; margin-bottom: 28px;
  letter-spacing: -0.035em;
}
.pilula {
  display: inline-block;
  background: #bfff00; color: #004d40;
  font-weight: 900; font-size: 48px; text-transform: uppercase;
  padding: 14px 38px; border-radius: 100px;
  letter-spacing: -0.03em;
}

.bottom-row {
  position: absolute; bottom: 75px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-symbol-only img { height: 72px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.30);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="noise"></div>
  <div class="handle">@hellogrowth__</div>

  <div class="stars-row">
    <svg class="star-active" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431L24 9.748l-6 5.851 1.417 8.265L12 19.771l-7.417 4.093L6 15.599 0 9.748l8.332-1.73z"/></svg>
    <svg class="star-active" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431L24 9.748l-6 5.851 1.417 8.265L12 19.771l-7.417 4.093L6 15.599 0 9.748l8.332-1.73z"/></svg>
    <svg class="star-active" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431L24 9.748l-6 5.851 1.417 8.265L12 19.771l-7.417 4.093L6 15.599 0 9.748l8.332-1.73z"/></svg>
    <svg class="star-dim" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431L24 9.748l-6 5.851 1.417 8.265L12 19.771l-7.417 4.093L6 15.599 0 9.748l8.332-1.73z"/></svg>
    <svg class="star-dim" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431L24 9.748l-6 5.851 1.417 8.265L12 19.771l-7.417 4.093L6 15.599 0 9.748l8.332-1.73z"/></svg>
  </div>

  <div class="pre-headline">E o outro lado da moeda?</div>
  <div class="headline-big">57%</div>
  <div class="headline">NÃO COMPRAM<br>DE EMPRESA COM</div>
  <div class="pilula">MENOS DE 4 ESTRELAS</div>

  <div class="bottom-row">
    <div class="logo-symbol-only">
      <img src="assets/logo-symbol.svg" alt="HG">
    </div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
