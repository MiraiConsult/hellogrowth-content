<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #edf0ee;
  font-family: 'Inter', sans-serif;
  color: #004d40;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse 800px 600px at top right, rgba(191,255,0,0.32) 0%, transparent 60%),
    radial-gradient(ellipse 600px 700px at bottom left, rgba(40,174,97,0.18) 0%, transparent 65%),
    linear-gradient(180deg, #f5f8f3 0%, #edf0ee 100%);
  padding: 100px 80px;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(0,77,64,0.4);
  letter-spacing: 0.05em;
}
.chat-bubble {
  margin-top: 80px;
  width: 280px;
  position: relative;
}
.chat-bubble svg {
  width: 100%; height: auto;
  filter: drop-shadow(0 12px 30px rgba(40,174,97,0.25));
}
.pre-headline {
  font-size: 32px; font-weight: 500;
  color: #1b6b5b; line-height: 1.35;
  margin-top: 50px; margin-bottom: 20px;
}
.pre-headline .accent {
  background: #bfff00;
  padding: 2px 12px;
  font-weight: 800; color: #004d40;
}
.headline {
  font-size: 70px; font-weight: 900;
  color: #004d40; line-height: 1; margin-bottom: 24px;
  letter-spacing: -0.04em;
}
.big-stat-pilula {
  display: inline-block;
  background: #004d40; color: #bfff00;
  font-weight: 900; font-size: 120px;
  padding: 14px 50px; border-radius: 100px;
  letter-spacing: -0.045em; line-height: 1;
  box-shadow: 0 12px 40px rgba(0,77,64,0.3);
}
.sub {
  font-size: 28px; font-weight: 500;
  color: #1b6b5b; line-height: 1.4;
  margin-top: 36px; max-width: 850px;
}
.sub strong { color: #004d40; font-weight: 700; }
.logo {
  position: absolute; bottom: 120px; left: 80px;
  display: flex; align-items: center; gap: 10px;
}
.logo-icon {
  width: 38px; height: 38px;
  background: #1b6b5b;
  border-radius: 12px 12px 12px 4px;
}
.logo-icon::before {
  content: ''; display: block; width: 14px; height: 3px; background: #bfff00; border-radius: 2px;
  margin: 17px auto;
}
.logo-text {
  font-size: 40px; font-weight: 800;
  color: #1b6b5b; letter-spacing: -0.025em;
}
.logo-text .g-mark { position: relative; }
.logo-text .g-mark::after {
  content: ''; position: absolute;
  width: 8px; height: 8px;
  background: #bfff00;
  top: 50%; left: 50%;
  transform: translate(-30%, -45%) rotate(45deg);
}
.arrow-next {
  position: absolute; bottom: 120px; right: 80px;
  width: 80px; height: 80px;
  background: #28ae61;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(40,174,97,0.35);
}
.arrow-next svg { width: 36px; height: 36px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="chat-bubble">
    <svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg">
      <path d="M 30 20 L 250 20 Q 270 20 270 40 L 270 150 Q 270 170 250 170 L 110 170 L 60 215 L 72 170 L 30 170 Q 10 170 10 150 L 10 40 Q 10 20 30 20 Z" fill="#28ae61"/>
      <circle cx="100" cy="95" r="10" fill="#bfff00"/>
      <circle cx="140" cy="95" r="10" fill="#bfff00"/>
      <circle cx="180" cy="95" r="10" fill="#bfff00"/>
    </svg>
  </div>

  <div class="pre-headline">Quem responde <span class="accent">75% das reviews</span> fatura</div>
  <div class="big-stat-pilula">+35%</div>
  <div class="sub">a mais do que quem ignora.<br><strong>Responder review é o marketing mais barato que existe.</strong></div>

  <div class="logo">
    <div class="logo-icon"></div>
    <div class="logo-text">Hello<span class="g-mark">G</span>rowth</div>
  </div>

  <div class="arrow-next">
    <svg viewBox="0 0 24 24" fill="none" stroke="#edf0ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </div>
</div>
</body>
</html>
