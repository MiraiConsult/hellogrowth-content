<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top left, rgba(40,174,97,0.22) 0%, transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(40,174,97,0.18) 0%, transparent 50%),
    linear-gradient(180deg, #004d40 0%, #1b6b5b 100%);
  display: flex; flex-direction: column;
  align-items: center; padding: 90px 80px;
}
.noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
  opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}
.content-wrap {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.icon-bubbles {
  position: relative; margin-bottom: 50px;
  filter: drop-shadow(0 0 35px rgba(191,255,0,0.3));
}
.icon-bubbles svg { width: 220px; height: 200px; }
.pre-headline {
  font-size: 32px; font-weight: 400; color: #edf0ee;
  text-align: center; margin-bottom: 24px; line-height: 1.3;
}
.pre-headline .accent { color: #bfff00; font-weight: 700; }
.headline {
  font-size: 78px; font-weight: 900; text-transform: uppercase;
  text-align: center; line-height: 1; margin-bottom: 24px;
  letter-spacing: -0.035em;
}
.pilula {
  display: inline-block;
  background: #bfff00; color: #004d40;
  font-weight: 900; font-size: 88px; text-transform: uppercase;
  padding: 18px 44px; border-radius: 100px;
  letter-spacing: -0.04em; line-height: 1;
  box-shadow: 0 0 60px rgba(191,255,0,0.3);
}
.sub {
  font-size: 28px; font-weight: 500; color: rgba(237,240,238,0.75);
  text-align: center; margin-top: 36px; line-height: 1.4;
  max-width: 800px;
}
.logo {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  font-size: 44px; font-weight: 700; letter-spacing: -0.02em;
}
.logo .hello { color: #edf0ee; }
.logo .growth { color: #28ae61; }
</style>
</head>
<body>
<div class="card">
  <div class="noise"></div>
  <div class="handle">@hellogrowth__</div>
  <div class="content-wrap">
    <div class="icon-bubbles">
      <svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M 30 30 L 150 30 Q 170 30 170 50 L 170 95 Q 170 115 150 115 L 80 115 L 50 145 L 55 115 L 30 115 Q 10 115 10 95 L 10 50 Q 10 30 30 30 Z" fill="#28ae61" opacity="0.6"/>
        <path d="M 70 80 L 200 80 Q 220 80 220 100 L 220 155 Q 220 175 200 175 L 145 175 L 115 200 L 120 175 L 70 175 Q 50 175 50 155 L 50 100 Q 50 80 70 80 Z" fill="#bfff00"/>
        <circle cx="100" cy="127" r="6" fill="#004d40"/>
        <circle cx="130" cy="127" r="6" fill="#004d40"/>
        <circle cx="160" cy="127" r="6" fill="#004d40"/>
      </svg>
    </div>
    <div class="pre-headline">Quem responde <span class="accent">75% das reviews</span></div>
    <div class="headline">FATURA</div>
    <div class="pilula">+35%</div>
    <div class="sub">Do que quem ignora.<br>É o marketing mais barato que existe.</div>
  </div>
  <div class="logo"><span class="hello">Hello</span><span class="growth">Growth</span></div>
</div>
</body>
</html>
