<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #edf0ee;
  font-family: 'Inter', sans-serif;
  color: #004d40;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse 800px 600px at top right, rgba(191,255,0,0.32) 0%, transparent 60%),
    radial-gradient(ellipse 600px 700px at bottom left, rgba(40,174,97,0.18) 0%, transparent 65%),
    linear-gradient(180deg, #f7faf5 0%, #edf0ee 100%);
  padding: 100px 80px;
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(0,77,64,0.4);
  letter-spacing: 0.05em;
}

.chat-bubble {
  margin-top: 100px;
  width: 230px;
  filter: drop-shadow(0 14px 30px rgba(40,174,97,0.30));
}
.chat-bubble svg { width: 100%; height: auto; display: block; }

.pre-headline {
  font-size: 36px; font-weight: 500;
  color: #1b6b5b; line-height: 1.35;
  margin-top: 56px; margin-bottom: 20px;
}
.pre-headline .accent {
  background: #bfff00;
  padding: 2px 14px;
  font-weight: 800; color: #004d40;
}
.big-stat-pilula {
  display: inline-block;
  background: #004d40; color: #bfff00;
  font-weight: 900; font-size: 160px;
  padding: 16px 56px; border-radius: 100px;
  letter-spacing: -0.055em; line-height: 1;
  box-shadow: 0 14px 50px rgba(0,77,64,0.35);
  margin-bottom: 36px;
}
.sub {
  font-size: 30px; font-weight: 500;
  color: #1b6b5b; line-height: 1.4;
  max-width: 850px;
}
.sub strong { color: #004d40; font-weight: 800; }

.bottom-row {
  position: absolute; bottom: 75px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-wordmark {
  font-family: 'Inter', sans-serif;
  font-weight: 900; font-size: 56px;
  line-height: 1; letter-spacing: -0.045em;
}
.logo-wordmark .hello { color: #1b6b5b; }
.logo-wordmark .growth { color: #28ae61; }
.arrow-next {
  width: 84px; height: 84px;
  background: #28ae61;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(40,174,97,0.35);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="chat-bubble">
    <svg viewBox="0 0 230 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M 25 20 L 205 20 Q 225 20 225 40 L 225 140 Q 225 160 205 160 L 95 160 L 50 200 L 60 160 L 25 160 Q 5 160 5 140 L 5 40 Q 5 20 25 20 Z" fill="#28ae61"/>
      <circle cx="80" cy="90" r="10" fill="#bfff00"/>
      <circle cx="115" cy="90" r="10" fill="#bfff00"/>
      <circle cx="150" cy="90" r="10" fill="#bfff00"/>
    </svg>
  </div>

  <div class="pre-headline">Quem responde <span class="accent">75% das reviews</span> fatura</div>
  <div class="big-stat-pilula">+35%</div>
  <div class="sub">a mais que quem ignora.<br><strong>Marketing mais barato que existe.</strong></div>

  <div class="bottom-row">
    <div class="logo-wordmark"><span class="hello">Hello</span><span class="growth">Growth</span></div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#edf0ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
