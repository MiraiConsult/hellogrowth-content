<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top left, rgba(40,174,97,0.20) 0%, transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(40,174,97,0.18) 0%, transparent 50%),
    linear-gradient(180deg, #1b6b5b 0%, #004d40 100%);
  padding: 100px 80px;
}
.handle {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}

.kicker {
  font-size: 30px; font-weight: 500; color: rgba(237,240,238,0.65);
  text-transform: uppercase; letter-spacing: 0.15em;
  margin-top: 90px; margin-bottom: 14px;
}
.headline {
  font-size: 72px; font-weight: 900; text-transform: uppercase;
  line-height: 0.98; margin-bottom: 56px;
  letter-spacing: -0.04em;
}
.headline .pilula-inline {
  display: inline-block;
  background: #bfff00; color: #004d40;
  padding: 4px 24px; line-height: 1.1;
}

.checklist { display: flex; flex-direction: column; gap: 22px; }
.check-item {
  display: flex; align-items: center; gap: 26px;
  background: rgba(0,77,64,0.5);
  border: 2px solid rgba(40,174,97,0.35);
  border-radius: 20px;
  padding: 30px 34px;
}
.check-num {
  width: 70px; height: 70px; min-width: 70px;
  background: #bfff00; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 38px; font-weight: 900; color: #004d40;
  letter-spacing: -0.03em;
}
.check-text {
  font-size: 34px; font-weight: 800; line-height: 1.2;
  text-transform: uppercase; letter-spacing: -0.025em;
}
.check-sub {
  font-size: 24px; font-weight: 500;
  color: rgba(237,240,238,0.6); margin-top: 4px;
  text-transform: none; letter-spacing: 0;
}

.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-symbol-only img { height: 150px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.30);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="kicker">3 ações que custam R$0:</div>
  <div class="headline">VALEM <span class="pilula-inline">R$45 MIL</span><br>NO FIM DO ANO</div>

  <div class="checklist">
    <div class="check-item">
      <div class="check-num">1</div>
      <div>
        <div class="check-text">Peça avaliação</div>
        <div class="check-sub">após cada entrega ao cliente</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-num">2</div>
      <div>
        <div class="check-text">Responda 100%</div>
        <div class="check-sub">das reviews em até 24 horas</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-num">3</div>
      <div>
        <div class="check-text">Monitore sua nota</div>
        <div class="check-sub">toda semana, sem exceção</div>
      </div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="logo-symbol-only">
      <img src="assets/logo-symbol-light.svg" alt="HG">
    </div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
