<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Winner: 4,6 no topo -->
  <g transform="translate(60, 30)">
    <!-- Building icon -->
    <rect x="0" y="20" width="120" height="100" rx="12" fill="#bfff00"/>
    <rect x="20" y="45" width="25" height="25" rx="4" fill="#004d40" opacity="0.3"/>
    <rect x="55" y="45" width="25" height="25" rx="4" fill="#004d40" opacity="0.3"/>
    <rect x="20" y="80" width="25" height="25" rx="4" fill="#004d40" opacity="0.3"/>
    <rect x="55" y="80" width="25" height="25" rx="4" fill="#004d40" opacity="0.3"/>
    <!-- Cross (clinic) -->
    <rect x="90" y="30" width="20" height="8" rx="2" fill="#004d40" opacity="0.5"/>
    <rect x="96" y="24" width="8" height="20" rx="2" fill="#004d40" opacity="0.5"/>

    <!-- Rating -->
    <text x="150" y="60" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="#bfff00">4,6</text>

    <!-- Stars -->
    <g transform="translate(150, 75)">
      <circle cx="8" cy="8" r="6" fill="#bfff00"/>
      <circle cx="24" cy="8" r="6" fill="#bfff00"/>
      <circle cx="40" cy="8" r="6" fill="#bfff00"/>
      <circle cx="56" cy="8" r="6" fill="#bfff00"/>
      <circle cx="72" cy="8" r="6" fill="#bfff00" opacity="0.5"/>
    </g>

    <!-- Review dots (many = volume) -->
    <g transform="translate(150, 100)" fill="#bfff00" opacity="0.6">
      <circle cx="5" cy="5" r="3"/><circle cx="15" cy="5" r="3"/><circle cx="25" cy="5" r="3"/>
      <circle cx="35" cy="5" r="3"/><circle cx="45" cy="5" r="3"/><circle cx="55" cy="5" r="3"/>
      <circle cx="65" cy="5" r="3"/><circle cx="75" cy="5" r="3"/><circle cx="85" cy="5" r="3"/>
      <circle cx="5" cy="15" r="3"/><circle cx="15" cy="15" r="3"/><circle cx="25" cy="15" r="3"/>
      <circle cx="35" cy="15" r="3"/><circle cx="45" cy="15" r="3"/><circle cx="55" cy="15" r="3"/>
      <circle cx="65" cy="15" r="3"/><circle cx="75" cy="15" r="3"/><circle cx="85" cy="15" r="3"/>
      <circle cx="95" cy="5" r="3"/><circle cx="105" cy="5" r="3"/><circle cx="115" cy="5" r="3"/>
      <circle cx="95" cy="15" r="3"/><circle cx="105" cy="15" r="3"/><circle cx="115" cy="15" r="3"/>
    </g>

    <!-- Label -->
    <text x="300" y="75" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#bfff00" opacity="0.7">312 avaliações</text>
  </g>

  <!-- Divider arrow -->
  <g transform="translate(280, 175)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#edf0ed" stroke-width="3" opacity="0.25" stroke-dasharray="8 6"/>
  </g>

  <!-- Loser: 4,9 embaixo -->
  <g transform="translate(60, 280)">
    <!-- Building icon (faded) -->
    <rect x="0" y="20" width="120" height="100" rx="12" fill="#edf0ed" opacity="0.25"/>
    <rect x="20" y="45" width="25" height="25" rx="4" fill="#edf0ed" opacity="0.1"/>
    <rect x="55" y="45" width="25" height="25" rx="4" fill="#edf0ed" opacity="0.1"/>
    <rect x="20" y="80" width="25" height="25" rx="4" fill="#edf0ed" opacity="0.1"/>
    <rect x="55" y="80" width="25" height="25" rx="4" fill="#edf0ed" opacity="0.1"/>
    <!-- Cross -->
    <rect x="90" y="30" width="20" height="8" rx="2" fill="#edf0ed" opacity="0.15"/>
    <rect x="96" y="24" width="8" height="20" rx="2" fill="#edf0ed" opacity="0.15"/>

    <!-- Rating -->
    <text x="150" y="60" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="#edf0ed" opacity="0.35">4,9</text>

    <!-- Stars (dim) -->
    <g transform="translate(150, 75)">
      <circle cx="8" cy="8" r="6" fill="#edf0ed" opacity="0.2"/>
      <circle cx="24" cy="8" r="6" fill="#edf0ed" opacity="0.2"/>
      <circle cx="40" cy="8" r="6" fill="#edf0ed" opacity="0.2"/>
      <circle cx="56" cy="8" r="6" fill="#edf0ed" opacity="0.2"/>
      <circle cx="72" cy="8" r="6" fill="#edf0ed" opacity="0.2"/>
    </g>

    <!-- Review dots (few) -->
    <g transform="translate(150, 100)" fill="#edf0ed" opacity="0.2">
      <circle cx="5" cy="5" r="3"/><circle cx="15" cy="5" r="3"/><circle cx="25" cy="5" r="3"/>
    </g>

    <!-- Label -->
    <text x="300" y="75" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#edf0ed" opacity="0.3">12 avaliações</text>
  </g>
</svg>
