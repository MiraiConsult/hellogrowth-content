<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.25) 0%, transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(191,255,0,0.12) 0%, transparent 55%),
    linear-gradient(160deg, #004d40 0%, #1b6b5b 60%, #004d40 100%);
  padding: 80px 80px;
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}

/* Google search bar element as decorative anchor */
.google-bar {
  margin-top: 100px;
  display: inline-flex; align-items: center; gap: 14px;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.18);
  border-radius: 50px;
  padding: 14px 28px;
  margin-bottom: 56px;
}
.g-logo {
  font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
}
.g-logo .b { color: #4285F4; }
.g-logo .r { color: #EA4335; }
.g-logo .y { color: #FBBC04; }
.g-logo .g { color: #34A853; }
.g-search-text {
  font-size: 22px; font-weight: 500;
  color: rgba(237,240,238,0.5);
}

/* Main content */
.pre {
  font-size: 44px; font-weight: 600;
  color: rgba(237,240,238,0.8);
  line-height: 1.2; margin-bottom: 14px;
}
.headline {
  font-size: 160px; font-weight: 900;
  color: #bfff00; line-height: 0.88;
  letter-spacing: -0.06em;
  text-shadow: 0 0 80px rgba(191,255,0,0.3);
  margin-bottom: 20px;
}
.mid {
  font-size: 52px; font-weight: 700;
  color: #edf0ee; line-height: 1.1;
  letter-spacing: -0.035em;
  margin-bottom: 8px;
}
.closer {
  font-size: 86px; font-weight: 900;
  color: #edf0ee; line-height: 0.95;
  letter-spacing: -0.05em;
  text-transform: uppercase;
}
.closer .num {
  color: #bfff00;
}

.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo-full img { height: 110px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.30);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="google-bar">
    <div class="g-logo"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span></div>
    <div class="g-search-text">dentista perto de mim</div>
  </div>

  <div class="pre">Você tem nota</div>
  <div class="headline">4,9</div>
  <div class="mid">e mesmo assim está</div>
  <div class="closer">perdendo pra<br>quem tem <span class="num">4,6.</span></div>

  <div class="bottom-row">
    <div class="logo-full">
      <img src="assets/logo-full-light.svg" alt="HelloGrowth">
    </div>
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
