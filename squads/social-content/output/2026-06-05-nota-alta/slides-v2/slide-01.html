<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.25) 0%, transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(191,255,0,0.12) 0%, transparent 55%),
    linear-gradient(160deg, #004d40 0%, #1b6b5b 60%, #004d40 100%);
  padding: 80px 80px;
  display: flex; flex-direction: column;
  justify-content: center;
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}

.line1 {
  font-size: 140px; font-weight: 900;
  color: #bfff00; line-height: 0.92;
  letter-spacing: -0.055em;
  text-shadow: 0 0 60px rgba(191,255,0,0.25);
}
.line2 {
  font-size: 48px; font-weight: 600;
  color: rgba(237,240,238,0.75); line-height: 1.2;
  margin-top: 20px; letter-spacing: -0.03em;
}
.line3 {
  font-size: 100px; font-weight: 900;
  color: #edf0ee; line-height: 0.95;
  margin-top: 16px; letter-spacing: -0.05em;
  text-transform: uppercase;
}
.line3 .num { color: #bfff00; }

.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.bottom-row img { height: 130px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #bfff00;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(191,255,0,0.30);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="line1">4,9 estrelas</div>
  <div class="line2">e mesmo assim perdendo</div>
  <div class="line3">pra quem<br>tem <span class="num">4,6?</span></div>

  <div class="bottom-row">
    <img src="assets/logo-symbol-light.svg" alt="HG">
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
