<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #edf0ee;
  font-family: 'Inter', sans-serif;
  color: #004d40;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse 900px 700px at top left, rgba(191,255,0,0.30) 0%, transparent 60%),
    radial-gradient(ellipse 700px 800px at bottom right, rgba(40,174,97,0.18) 0%, transparent 65%),
    linear-gradient(180deg, #f7faf5 0%, #edf0ee 100%);
  padding: 80px 80px;
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(0,77,64,0.4);
  letter-spacing: 0.05em;
}

/* Google logo inline */
.g-logo {
  font-size: 36px; font-weight: 700; letter-spacing: -0.02em;
  display: inline;
}
.g-logo .b { color: #4285F4; }
.g-logo .r { color: #EA4335; }
.g-logo .y { color: #FBBC04; }
.g-logo .g { color: #34A853; }

.intro {
  margin-top: 100px;
  font-size: 48px; font-weight: 800;
  color: #004d40; line-height: 1.2;
  letter-spacing: -0.035em;
  margin-bottom: 36px;
}

.body-text {
  font-size: 34px; font-weight: 500;
  color: #1b6b5b; line-height: 1.55;
  margin-bottom: 44px;
}
.body-text .accent {
  background: #bfff00;
  padding: 2px 10px;
  font-weight: 800; color: #004d40;
}

.compare-row {
  display: flex; gap: 24px;
}
.compare-box {
  flex: 1;
  border-radius: 24px;
  padding: 30px 24px;
  text-align: center;
}
.compare-box.loser {
  background: rgba(0,77,64,0.06);
  border: 2px solid rgba(0,77,64,0.12);
}
.compare-box.winner {
  background: #004d40;
  color: #edf0ee;
  box-shadow: 0 14px 40px rgba(0,77,64,0.30);
}
.compare-rating {
  font-size: 72px; font-weight: 900;
  line-height: 1; letter-spacing: -0.04em;
  margin-bottom: 8px;
}
.compare-box.winner .compare-rating { color: #bfff00; }
.compare-reviews { font-size: 24px; font-weight: 700; line-height: 1.2; }
.compare-note { font-size: 18px; font-weight: 500; margin-top: 8px; opacity: 0.6; }
.compare-box.winner .compare-note { opacity: 0.7; }
.compare-label {
  margin-top: 12px;
  font-size: 16px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.12em;
}
.compare-box.winner .compare-label {
  background: #bfff00; color: #004d40;
  display: inline-block; padding: 4px 12px; border-radius: 50px;
}

.bottom-row {
  position: absolute; bottom: 130px; left: 80px; right: 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.bottom-row img { height: 120px; }
.arrow-next {
  width: 84px; height: 84px;
  background: #28ae61;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(40,174,97,0.35);
}
.arrow-next svg { width: 38px; height: 38px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="intro">O <span class="g-logo"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span></span> não olha<br>só a nota.</div>

  <div class="body-text">Olha <span class="accent">quantas avaliações</span> você tem,<br>se são <span class="accent">recentes</span> e se chegam<br><span class="accent">toda semana</span>.</div>

  <div class="compare-row">
    <div class="compare-box loser">
      <div class="compare-rating">4,9</div>
      <div class="compare-reviews">12 avaliações</div>
      <div class="compare-note">paradas há meses</div>
      <div class="compare-label">não aparece</div>
    </div>
    <div class="compare-box winner">
      <div class="compare-rating">4,6</div>
      <div class="compare-reviews">300 avaliações</div>
      <div class="compare-note">atualizadas sempre</div>
      <div class="compare-label">topo do Google</div>
    </div>
  </div>

  <div class="bottom-row">
    <img src="assets/logo-symbol.svg" alt="HG">
    <div class="arrow-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#edf0ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
