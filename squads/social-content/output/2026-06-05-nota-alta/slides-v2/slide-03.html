<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.22) 0%, transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(191,255,0,0.10) 0%, transparent 55%),
    linear-gradient(160deg, #004d40 0%, #1b6b5b 50%, #004d40 100%);
  padding: 80px 80px;
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}

/* Google logo inline */
.g-logo {
  font-size: inherit; font-weight: 700; letter-spacing: -0.02em;
  display: inline;
}
.g-logo .b { color: #4285F4; }
.g-logo .r { color: #EA4335; }
.g-logo .y { color: #FBBC04; }
.g-logo .g { color: #34A853; }

.headline {
  margin-top: 140px;
  font-size: 60px; font-weight: 900;
  color: #edf0ee; line-height: 1.15;
  letter-spacing: -0.04em;
  margin-bottom: 16px;
}
.highlight-line {
  display: block;
  margin-top: 14px;
}
.highlight-line .hl {
  background: #bfff00; color: #004d40;
  padding: 6px 18px;
  font-weight: 900;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.closer {
  margin-top: 40px;
  font-size: 44px; font-weight: 700;
  color: #bfff00; line-height: 1.2;
  letter-spacing: -0.03em;
}

.cta-section {
  margin-top: 56px;
}
.cta-text {
  font-size: 30px; font-weight: 500;
  color: rgba(237,240,238,0.7);
  line-height: 1.45;
  margin-bottom: 30px;
}
.cta-text strong { color: #edf0ee; font-weight: 800; }
.cta-pill {
  display: inline-block;
  background: #bfff00; color: #004d40;
  font-weight: 900; font-size: 36px;
  text-transform: uppercase;
  padding: 16px 34px; border-radius: 100px;
  letter-spacing: -0.02em;
  box-shadow: 0 12px 36px rgba(191,255,0,0.30);
}

.bottom-row {
  position: absolute; bottom: 130px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
}
.bottom-row img { height: 110px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="headline">
    Sua qualidade não aparece<br>
    no <span class="g-logo"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span></span> porque ela não está
    <span class="highlight-line"><span class="hl">virando avaliação.</span></span>
  </div>
  <div class="closer">É esse processo que falta.</div>

  <div class="cta-section">
    <div class="cta-text">Coleta automática. Recência. Frequência.<br><strong>A gente monta esse processo pra você.</strong></div>
    <div class="cta-pill">LINK NA BIO</div>
  </div>

  <div class="bottom-row">
    <img src="assets/logo-full-light.svg" alt="HelloGrowth">
  </div>
</div>
</body>
</html>
