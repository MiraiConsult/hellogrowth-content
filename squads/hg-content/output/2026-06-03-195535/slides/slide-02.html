<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px;
  height: 1350px;
  background: #0a0a0a;
  font-family: 'Montserrat', sans-serif;
  color: #ffffff;
  overflow: hidden;
}
.card {
  width: 1080px;
  height: 1350px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 70px 65px;
}
.bg-orb1 {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,170,122,0.35) 0%, transparent 70%);
  top: 150px;
  right: -100px;
  filter: blur(90px);
}
.bg-orb2 {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(45,125,95,0.3) 0%, transparent 70%);
  bottom: 200px;
  left: -50px;
  filter: blur(70px);
}
.handle {
  position: absolute;
  top: 40px;
  left: 65px;
  font-weight: 500;
  font-size: 18px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.5px;
  z-index: 10;
}
.content { position: relative; z-index: 5; }
.intro {
  font-weight: 400;
  font-size: 30px;
  color: rgba(255,255,255,0.55);
  line-height: 1.6;
  margin-bottom: 50px;
}
.stat-container {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 24px;
  padding: 50px 45px;
  margin-bottom: 50px;
}
.stat-number {
  font-weight: 900;
  font-size: 110px;
  background: linear-gradient(135deg, #6CCFAA, #3BAA7A);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 15px;
}
.stat-label {
  font-weight: 700;
  font-size: 32px;
  line-height: 1.4;
  color: rgba(255,255,255,0.9);
}
.bottom-line {
  display: flex;
  align-items: center;
  gap: 16px;
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #3BAA7A;
  box-shadow: 0 0 12px rgba(59,170,122,0.5);
  flex-shrink: 0;
}
.bottom-text {
  font-weight: 700;
  font-size: 32px;
  color: rgba(255,255,255,0.85);
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="card">
  <div class="bg-orb1"></div>
  <div class="bg-orb2"></div>
  <div class="handle">@hellogrowth__</div>
  <div class="content">
    <div class="intro">Harvard analisou<br>milhares de empresas<br>e descobriu:</div>
    <div class="stat-container">
      <div class="stat-number">+5 a 9%</div>
      <div class="stat-label">de receita por cada<br>estrela a mais no Google.</div>
    </div>
    <div class="bottom-line">
      <div class="dot"></div>
      <div class="bottom-text">Isso não é opinião.<br>É dado.</div>
    </div>
  </div>
</div>
</body>
</html>
