<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px;
  height: 1350px;
  background: #0a0a0a;
  font-family: 'Montserrat', sans-serif;
  color: #ffffff;
  overflow: hidden;
}
.card {
  width: 1080px;
  height: 1350px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.bg-orb1 {
  position: absolute;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(45,125,95,0.6) 0%, transparent 70%);
  top: -100px;
  right: -150px;
  filter: blur(80px);
}
.bg-orb2 {
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(108,207,170,0.4) 0%, transparent 70%);
  bottom: 100px;
  left: -100px;
  filter: blur(100px);
}
.bg-orb3 {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,170,122,0.3) 0%, transparent 70%);
  top: 400px;
  left: 300px;
  filter: blur(60px);
}
.handle {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 500;
  font-size: 18px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 1px;
  z-index: 10;
}
.glass-panel {
  position: relative;
  z-index: 5;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 32px;
  padding: 60px 55px;
  margin: 0 50px;
  width: 900px;
}
.number {
  font-weight: 900;
  font-size: 130px;
  background: linear-gradient(135deg, #6CCFAA 0%, #A0E8CC 50%, #3BAA7A 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 25px;
}
.headline {
  font-weight: 900;
  font-size: 46px;
  line-height: 1.2;
  margin-bottom: 20px;
}
.subtext {
  font-weight: 500;
  font-size: 28px;
  color: rgba(255,255,255,0.5);
}
.glow-line {
  width: 120px;
  height: 4px;
  background: linear-gradient(90deg, #6CCFAA, #3BAA7A);
  border-radius: 2px;
  margin: 25px auto 0;
  box-shadow: 0 0 20px rgba(108,207,170,0.4);
}
</style>
</head>
<body>
<div class="card">
  <div class="bg-orb1"></div>
  <div class="bg-orb2"></div>
  <div class="bg-orb3"></div>
  <div class="handle">@hellogrowth__</div>
  <div class="glass-panel">
    <div class="number">+R$45 mil</div>
    <div class="headline">É o que 1 estrela a mais vale pro seu negócio.</div>
    <div class="subtext">Harvard comprovou.</div>
    <div class="glow-line"></div>
  </div>
</div>
</body>
</html>
