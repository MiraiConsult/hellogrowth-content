<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1920px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: #004d40; font-family: 'Inter', sans-serif; overflow: hidden; }
.card { width: 1080px; height: 1920px; position: relative; }

/* Photo background */
.bg-photo {
  position: absolute; inset: 0;
  background: url('/home/user/hellogrowth-content/squads/social-content/output/photo-pack/reels-4fases.png') center top / cover no-repeat;
}
.overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,77,64,0) 0%,
    rgba(0,77,64,0) 25%,
    rgba(0,77,64,0.4) 45%,
    rgba(0,77,64,0.85) 60%,
    rgba(0,77,64,0.95) 75%,
    rgba(0,77,64,0.92) 100%
  );
}

.content {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 0 70px 160px;
  z-index: 2;
}

.kicker {
  font-size: 36px; font-weight: 600;
  color: rgba(237,240,237,0.7);
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
.headline {
  font-size: 72px; font-weight: 900;
  color: #edf0ed; line-height: 1;
  letter-spacing: -0.045em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.headline .accent { color: #bfff00; }
.sub-headline {
  font-size: 56px; font-weight: 900;
  color: #bfff00; line-height: 1.05;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  margin-bottom: 40px;
}

/* 4 phase pills */
.phases { display: flex; flex-direction: column; gap: 14px; }
.phase {
  display: flex; align-items: center; gap: 16px;
}
.phase-num {
  width: 52px; height: 52px; min-width: 52px;
  background: #bfff00; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 900; color: #004d40;
}
.phase-text {
  font-size: 30px; font-weight: 700;
  color: #edf0ed; letter-spacing: -0.02em;
}

.logo-wrap {
  position: absolute; left: 70px; bottom: 60px; z-index: 2;
}
.logo-wrap img { height: 80px; }
</style>
</head>
<body>
<div class="card">
  <div class="bg-photo"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="kicker">Da consulta à indicação:</div>
    <div class="headline">AS <span class="accent">4 FASES</span></div>
    <div class="sub-headline">QUE TRANSFORMAM<br>PACIENTE EM INDICAÇÃO</div>

    <div class="phases">
      <div class="phase">
        <div class="phase-num">1</div>
        <div class="phase-text">Qualificação</div>
      </div>
      <div class="phase">
        <div class="phase-num">2</div>
        <div class="phase-text">Anamnese</div>
      </div>
      <div class="phase">
        <div class="phase-num">3</div>
        <div class="phase-text">Categorização</div>
      </div>
      <div class="phase">
        <div class="phase-num">4</div>
        <div class="phase-text">Pós-venda</div>
      </div>
    </div>
  </div>

  <div class="logo-wrap">
    <img src="/home/user/hellogrowth-content/squads/social-content/output/2026-06-08-3sinais/slides/assets/logo-symbol-light.svg" alt="HG">
  </div>
</div>
</body>
</html>
