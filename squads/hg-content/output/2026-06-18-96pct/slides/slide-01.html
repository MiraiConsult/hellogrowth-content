<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; background: #0a5e4d; font-family: 'Inter', sans-serif; color: #edf0ed; overflow: hidden; }
.card { width: 1080px; height: 1350px; position: relative; }
.orb { position: absolute; border-radius: 50%; }
.orb1 { width: 555px; height: 529px; left: -80px; top: -66px; background: #1d884a; filter: blur(250px); }
.orb2 { width: 556px; height: 562px; left: 713px; top: 295px; background: #1d884a; filter: blur(250px); }
.orb3 { width: 626px; height: 600px; left: -239px; top: 857px; background: #116836; filter: blur(250px); }
.handle { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 500; color: rgba(237,240,237,0.4); letter-spacing: 0.05em; }

.content { position: absolute; left: 80px; right: 80px; display: flex; flex-direction: column; justify-content: center; top: 200px; }

.big-num {
  font-size: 260px; font-weight: 900;
  color: #bfff00; line-height: 0.85;
  letter-spacing: -0.06em;
  text-shadow: 0 0 80px rgba(191,255,0,0.25);
  margin-bottom: 16px;
}
.headline {
  font-size: 60px; font-weight: 900;
  color: #edf0ed; line-height: 1.05;
  letter-spacing: -0.04em;
  text-transform: uppercase;
}
.sub {
  font-size: 36px; font-weight: 500;
  color: rgba(237,240,237,0.6);
  line-height: 1.3; margin-top: 24px;
}

.logo-wrap { position: absolute; left: 33px; top: 1060px; }
.logo-wrap img { height: 164px; }
.arrow-wrap { position: absolute; right: 80px; bottom: 130px; }
.arrow-circle { width: 84px; height: 84px; background: #bfff00; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.arrow-circle svg { width: 36px; height: 36px; }
</style>
</head>
<body>
<div class="card">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="handle">@hellogrowth__</div>

  <div class="content">
    <div class="big-num">96%</div>
    <div class="headline">DOS SEUS PACIENTES<br>ESTÃO TE JULGANDO<br>AGORA NO GOOGLE.</div>
    <div class="sub">Antes de ligar. Antes de marcar.<br>Antes de pisar na sua clínica.</div>
  </div>

  <div class="logo-wrap"><img src="assets/logo-symbol-light.svg" alt="HG"></div>
  <div class="arrow-wrap">
    <div class="arrow-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#004d40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </div>
  </div>
</div>
</body>
</html>
