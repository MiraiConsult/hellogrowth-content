<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #edf0ee;
  font-family: 'Inter', sans-serif;
  color: #004d40;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse 900px 700px at top, rgba(191,255,0,0.32) 0%, transparent 60%),
    radial-gradient(ellipse 700px 800px at bottom right, rgba(40,174,97,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 700px 800px at bottom left, rgba(40,174,97,0.22) 0%, transparent 65%),
    linear-gradient(180deg, #f7faf5 0%, #edf0ee 100%);
  padding: 90px 80px;
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(0,77,64,0.4);
  letter-spacing: 0.05em;
}

/* GMB top result mockup */
.gmb-top {
  margin-top: 80px;
  background: #ffffff;
  border-radius: 24px;
  padding: 26px 30px;
  display: flex; align-items: center; gap: 22px;
  box-shadow: 0 18px 50px rgba(40,174,97,0.25);
  border: 3px solid #28ae61;
  position: relative;
}
.tag-topo-1 {
  position: absolute; top: -16px; left: 30px;
  background: #bfff00;
  color: #004d40;
  font-size: 16px; font-weight: 800;
  padding: 6px 16px; border-radius: 50px;
  text-transform: uppercase; letter-spacing: 0.1em;
  box-shadow: 0 6px 16px rgba(191,255,0,0.4);
}
.gmb-rank-top {
  width: 64px; height: 64px;
  background: #28ae61;
  color: #edf0ee;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 900;
}
.gmb-top-info { flex: 1; }
.gmb-top-name {
  font-size: 30px; font-weight: 800;
  color: #1b6b5b; line-height: 1; letter-spacing: -0.02em;
}
.gmb-top-meta {
  display: flex; align-items: center; gap: 10px;
  margin-top: 8px;
  font-size: 22px; color: #5f6368; font-weight: 500;
}
.gmb-top-rating { font-weight: 800; color: #004d40; font-size: 24px; }
.gmb-top-stars { color: #f59e0b; font-size: 20px; letter-spacing: 1px; }

.content {
  margin-top: 70px;
}
.kicker {
  font-size: 36px; font-weight: 600;
  color: #1b6b5b; line-height: 1.3; margin-bottom: 14px;
}
.headline {
  font-size: 110px; font-weight: 900;
  color: #004d40; line-height: 0.92; margin-bottom: 30px;
  letter-spacing: -0.05em;
  text-transform: uppercase;
}
.pilula {
  display: inline-block;
  background: #004d40; color: #bfff00;
  font-weight: 900; font-size: 44px; text-transform: uppercase;
  padding: 16px 34px; border-radius: 100px;
  letter-spacing: -0.025em; line-height: 1;
  box-shadow: 0 14px 40px rgba(0,77,64,0.30);
  margin-bottom: 34px;
  margin-left: -34px;
}
.sub {
  font-size: 28px; font-weight: 500;
  color: #1b6b5b; line-height: 1.45;
  max-width: 900px;
}
.sub strong { color: #004d40; font-weight: 800; }

.bottom-row {
  position: absolute; bottom: 80px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
}
.bottom-row img { height: 110px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <div class="gmb-top">
    <div class="tag-topo-1">1º no Google</div>
    <div class="gmb-rank-top">★</div>
    <div class="gmb-top-info">
      <div class="gmb-top-name">Sua empresa aqui</div>
      <div class="gmb-top-meta">
        <span class="gmb-top-rating">4,8</span>
        <span class="gmb-top-stars">★★★★★</span>
        <span>· 487 avaliações</span>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="kicker">É esse o processo que falta:</div>
    <div class="headline">a gente coloca<br>no lugar.</div>
    <div class="pilula">VAMOS CONVERSAR</div>
    <div class="sub">Coleta automática + recência + frequência rodando todo dia.<br><strong>Link na bio</strong> pra começar.</div>
  </div>

  <div class="bottom-row">
    <img src="assets/logo-full.svg" alt="HelloGrowth">
  </div>
</div>
</body>
</html>
