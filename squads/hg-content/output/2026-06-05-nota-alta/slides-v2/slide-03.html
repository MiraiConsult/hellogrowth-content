<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 1350px;
  background: #004d40;
  font-family: 'Inter', sans-serif;
  color: #edf0ee;
  overflow: hidden;
  letter-spacing: -0.02em;
}
.card {
  width: 1080px; height: 1350px;
  position: relative;
  background:
    radial-gradient(ellipse at top right, rgba(40,174,97,0.22) 0%, transparent 55%),
    radial-gradient(ellipse at bottom left, rgba(191,255,0,0.10) 0%, transparent 55%),
    linear-gradient(160deg, #004d40 0%, #1b6b5b 50%, #004d40 100%);
}
.handle {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 500; color: rgba(237,240,238,0.4);
  letter-spacing: 0.05em;
}

/* Glass card */
.glass-card {
  position: absolute;
  left: 86px; top: 236px;
  width: 908px; height: 371px;
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 32px;
}

/* Text inside glass card */
.gl-line1 {
  position: absolute;
  left: 42px; top: 60px;
  font-size: 54px; font-weight: 900;
  color: #edf0ee; letter-spacing: -0.035em;
}
.gl-line2 {
  position: absolute;
  left: 42px; top: 128px;
  font-size: 54px; font-weight: 900;
  color: #edf0ee; letter-spacing: -0.035em;
}
.google-pill {
  position: absolute;
  left: 117px; top: 132px;
  width: 202px; height: 64px;
  background: rgba(255,255,255,0.92);
  border-radius: 50px;
  display: flex; align-items: center; justify-content: center;
}
.google-pill span { font-size: 49px; font-weight: 700; }
.google-pill .b { color: #4285F4; }
.google-pill .r { color: #EA4335; }
.google-pill .y { color: #FBBC04; }
.google-pill .g { color: #34A853; }

/* Highlight block */
.hl-block {
  position: absolute;
  left: 42px; top: 219px;
  background: #bfff00;
  border-radius: 4px;
  padding: 13px 23px;
}
.hl-block span {
  font-size: 54px; font-weight: 900;
  color: #004d40; letter-spacing: -0.035em;
}

/* Below glass */
.closer {
  position: absolute;
  left: 130px; top: 654px;
  font-size: 44px; font-weight: 700;
  color: #bfff00; letter-spacing: -0.03em;
}
.cta-text {
  position: absolute;
  left: 130px; top: 723px;
  width: 820px;
  font-size: 30px; font-weight: 500;
  color: rgba(237,240,238,0.7);
  line-height: 1.5;
}
.cta-text strong {
  color: #edf0ee; font-weight: 800;
}

/* Glass behind CTA section */
.glass-cta {
  position: absolute;
  left: 86px; top: 630px;
  width: 908px; height: 240px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 28px;
}

.logo-wrap {
  position: absolute;
  left: 364px; top: 1129px;
}
.logo-wrap img { height: 72px; }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@hellogrowth__</div>

  <!-- Glass card -->
  <div class="glass-card">
    <div class="gl-line1">Sua qualidade não aparece</div>
    <div class="gl-line2">no &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; porque ela</div>
    <div class="google-pill">
      <span><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span></span>
    </div>
    <div class="hl-block"><span>não está virando avaliação.</span></div>
  </div>

  <!-- Glass CTA -->
  <div class="glass-cta"></div>
  <div class="closer">É esse processo que falta.</div>
  <div class="cta-text">Coleta automática. Recência. Frequência.<br><strong>A gente monta esse processo pra você.</strong></div>

  <div class="logo-wrap">
    <img src="assets/logo-full-light.svg" alt="HelloGrowth">
  </div>
</div>
</body>
</html>
